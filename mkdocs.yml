site_name: Redteam Wiki
site_url: https://redteam-wiki.org/
site_description: 免费、面向实战、新手友好的红队攻防技术入门指南
copyright: 文档内容采用 CC BY-SA 4.0 许可
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

plugins:
  - search:
      lang:
        - zh
        - en
  - redirects:
      redirect_maps:
        privilege-escalation.md: en/privilege-escalation.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-4
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - admonition

extra_css:
  - stylesheets/extra.css

