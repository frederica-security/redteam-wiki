<p>想象一下，你通过精心设计的钓鱼邮件或在内网中横向移动，终于成功控制了一台目标PC。</p>
<p>你兴奋地在 Shell 中敲下 <code>whoami /groups</code>，屏幕上赫然显示你所在的组是：<strong>BUILTIN\Administrators</strong>（管理员组）。</p>
<p>“太棒了！”你心想，“我是管理员，干什么都可以。”</p>
<p>于是，你试图运行 Mimikatz 抓取密码，或者试图向 <code>C:\Windows\System32</code> 写入一个持久化后门。</p>
<p>结果，你只得到这个结果：<strong>Access Denied（拒绝访问）</strong>。</p>
<p>你可能会怀疑人生：“我明明在 Administrators 组里，为什么连个文件都写不进去？”</p>
<p><strong>欢迎来到 UAC（用户账户控制）。</strong></p>
<hr>
<h2 id="h-2-什么是-uac那个烦人的弹窗" class="toc-header"><a class="toc-anchor" href="#h-2-什么是-uac那个烦人的弹窗">¶</a> 2. 什么是 UAC？（那个烦人的弹窗）</h2>
<p>在 Windows Vista 之前（比如 XP 时代），管理员就是神，运行什么都是最高权限。这导致病毒一旦进来就能毁灭系统。</p>
<p>为了安全，微软引入了 <strong>UAC (User Account Control)</strong>。它的核心逻辑是：</p>
<p><strong>“平时是平民，用时才变身。”</strong></p>
<p>即使你是管理员，登录后系统也只给你一个“缩水版”的权限令牌（Medium Integrity）。只有当你真正需要干大事（比如装软件、改系统设置）时，系统才会弹出一个黑屏窗口问你：“你确定要允许此应用对你的设备进行更改吗？”</p>
<p>只有你点了“是”，系统才会给你一个<strong>完整版</strong>的高权限令牌（High Integrity）。</p>
<p><strong>对于红队黑客来说，这个弹窗是致命的。</strong></p>
<p>因为我们在远程控制别人的电脑，一旦触发这个弹窗，受害者会在屏幕上看到，而我们不仅看不到弹窗，还会因为无法点击“是”而被拒之门外。</p>
<p><strong>BypassUAC 的目的，就是不触发那个弹窗，悄悄地让系统把“完整版权限”交还给我们。</strong></p>
<hr>
<h2 id="h-3-绕过的核心原理系统信任的背叛" class="toc-header"><a class="toc-anchor" href="#h-3-绕过的核心原理系统信任的背叛">¶</a> 3. 绕过的核心原理：系统信任的“背叛”</h2>
<p>既然 UAC 这么严，为什么还能绕过呢？因为 Windows 对“自家人”非常偏心。</p>
<p>微软设置了一个 <strong>“白名单机制” (AutoElevate)</strong>。</p>
<p>系统里有许多微软自带的程序（比如 <code>任务管理器</code>、<code>事件查看器</code>、<code>fodhelper.exe</code> 等），它们在启动时，<strong>系统会默认它们是安全的，自动静默提升权限，不会弹窗。</strong></p>
<p>这就给了我们可乘之机。</p>
<p><strong>典型攻击思路：</strong></p>
<p>如果我能“欺骗”或者“劫持”这些受信任的白名单程序，让它们在拥有高权限的时候，顺便帮我执行一下我的恶意代码，那我不也就拥有高权限了吗？</p>
<p>这就像是：你想进一个高级VIP俱乐部（高权限），门口保安（UAC）不让你进。但这时候，俱乐部的老板（白名单程序）来了，保安不敢拦。你迅速躲进老板的行李箱里（注入/劫持），就这样大摇大摆地混进去了。</p>
<p>具体怎么躲进行李箱？这涉及到一些基础知识。</p>
<hr>
<h2 id="h-4-深度解析uac-绕过的三大流派" class="toc-header"><a class="toc-anchor" href="#h-4-深度解析uac-绕过的三大流派">¶</a> 4. 深度解析：UAC 绕过的三大流派</h2>
<p>虽然绕过方法有几十种，但万变不离其宗，主要归结为以下三类技术。</p>
<h3 id="️-流派一注册表劫持-registry-manipulation" class="toc-header"><a class="toc-anchor" href="#️-流派一注册表劫持-registry-manipulation">¶</a> 🛠️ 流派一：注册表劫持 (Registry Manipulation)</h3>
<p>这是最常见、最经典的技术（例如著名的 <code>fodhelper</code> 利用）。</p>
<ul>
<li><strong>原理：</strong> 很多高权限系统程序在启动时，会去查询注册表里的特定键值，来决定“我要运行什么”。而普通用户刚好有权限修改这些键值。</li>
<li><strong>攻击链：</strong>
<ol>
<li><strong>目标：</strong> <code>fodhelper.exe</code>（Windows 功能管理工具，自动高权限）。</li>
<li><strong>劫持：</strong> 它启动时会查询 <code>ms-settings</code> 协议。我们将注册表中该协议的关联命令改为 <code>cmd.exe</code>。</li>
<li><strong>触发：</strong> 攻击者启动 <code>fodhelper.exe</code>。</li>
<li><strong>结果：</strong> <code>fodhelper</code>（高权限）读取注册表 -&gt; 发现命令是 <code>cmd.exe</code> -&gt; <strong>以高权限启动 CMD</strong>。</li>
</ol>
</li>
</ul>
<h3 id="️-流派二dll-劫持与文件操作-ifileoperation" class="toc-header"><a class="toc-anchor" href="#️-流派二dll-劫持与文件操作-ifileoperation">¶</a> 🛠️ 流派二：DLL 劫持与文件操作 (IFileOperation)</h3>
<p>你可能会问：“DLL 劫持我懂，但我不是管理员，我没办法把我的毒 DLL 复制到 <code>C:\Windows\System32</code> 这种受保护目录去劫持系统程序啊？”</p>
<p>这就引入了 Windows 的一个神奇 COM 接口：<strong><code>IFileOperation</code></strong>。</p>
<ul>
<li><strong>原理：</strong> <code>IFileOperation</code> 是资源管理器用来复制文件的组件。它是一个<strong>自动提权</strong>的 COM 对象。只要你不是把 UAC 设置为最高级别，它就会<strong>不弹窗</strong>地帮你把文件复制到系统目录。</li>
<li><strong>攻击链：</strong>
<ol>
<li><strong>准备：</strong> 准备一个恶意的 DLL（例如 <code>cryptbase.dll</code>）。</li>
<li><strong>搬运：</strong> 调用 <code>IFileOperation</code> 接口，请求系统把这个 DLL 复制到 <code>C:\Windows\System32\sysprep\</code> 目录下（普通方式无法写入）。</li>
<li><strong>触发：</strong> 启动 <code>sysprep.exe</code>。</li>
<li><strong>结果：</strong> <code>sysprep</code> 在高权限目录下发现了恶意的 DLL 并加载，代码执行成功。</li>
</ol>
</li>
</ul>
<h3 id="️-流派三滥用高权限-com-接口" class="toc-header"><a class="toc-anchor" href="#️-流派三滥用高权限-com-接口">¶</a> 🛠️ 流派三：滥用高权限 COM 接口</h3>
<p>这是一种更“优雅”的技术，通常不需要文件落地。</p>
<ul>
<li><strong>原理：</strong> Windows 中有一些 COM 接口设计之初就是为了执行管理任务的。</li>
<li><strong>攻击链：</strong> 攻击者在低权限下实例化一个配置为 Auto-Elevate 的 COM 对象，然后调用其公开的方法（如 <code>ShellExec</code>），让这个高权限的对象帮我们去运行指定的程序。</li>
</ul>
<hr>
<h2 id="h-5-实战兵器uacme-uac-me" class="toc-header"><a class="toc-anchor" href="#h-5-实战兵器uacme-uac-me">¶</a> 5. 实战兵器：UACME (UAC Me)</h2>
<p>原理听起来很复杂，但在实战中，我们通常使用现成的工具。</p>
<p><code>hfiref0x</code> 开发了名为 <strong>UACME</strong> 的开源项目，它几乎是 BypassUAC 界的“百科全书”，收录了 70 多种绕过方法。</p>
<ul>
<li><strong>项目地址：</strong> <code>https://github.com/hfiref0x/UACME</code></li>
<li><strong>核心工具：</strong> <code>Akagi</code></li>
</ul>
<h3 id="如何使用" class="toc-header"><a class="toc-anchor" href="#如何使用">¶</a> 如何使用？</h3>
<p>UACME 编译后会得到一个 <code>akagi64.exe</code>。使用方法非常简单：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash"># 语法：akagi64.exe [方法编号] [你想运行的程序]

# 例子：使用方法 61 (基于注册表劫持)，启动一个高权限的 CMD
akagi64.exe 61 c:\windows\system32\cmd.exe
</code></pre>
<p>一旦成功，你会发现弹出的新 CMD 窗口标题栏上写着“管理员”，或者运行 <code>whoami /groups</code> 时，能看到 <code>High Mandatory Level</code>（高完整性级别）。这意味着你拿回了原本属于你的权力。</p>
<hr>
<h2 id="h-6-️-对抗视角防守方如何发现你" class="toc-header"><a class="toc-anchor" href="#h-6-️-对抗视角防守方如何发现你">¶</a> 6. 🛡️ 对抗视角：防守方如何发现你？</h2>
<p>不要以为用了 UACME 就万事大吉。现在的 EDR（终端检测响应系统）对这些行为极其敏感。</p>
<ol>
<li><strong>文件查杀：</strong> <code>Akagi.exe</code> 这个文件本身就是全网通缉犯，落地即杀。实战中我们通常只参考其<strong>代码原理</strong>，自己重写一个小工具。</li>
<li><strong>父子进程异常：</strong> 如果 <code>fodhelper.exe</code> 突然生出了一个 <code>cmd.exe</code> 或 <code>powershell.exe</code> 作为子进程，这在正常系统中是不可能发生的，EDR 会直接报警。</li>
<li><strong>注册表监控：</strong> 类似 <code>HKCU\Software\Classes\ms-settings\</code> 这种敏感注册表位置，是 EDR 的重点监控对象。</li>
</ol>
<hr>
<h2 id="h-7-️-注意事项" class="toc-header"><a class="toc-anchor" href="#h-7-️-注意事项">¶</a> 7. ⚠️ 注意事项</h2>
<p>最后，强调几个新手最容易犯的错误：</p>
<ol>
<li><strong>Bypass UAC ≠ 提权 (LPE)：</strong>
<ul>
<li>Bypass UAC 的前提是<strong>你已经是管理员组的用户</strong>，只是被 UAC 限制了。</li>
<li>如果你只是一个普通用户（User 组），UACME 是救不了你的，你需要的是内核提权漏洞（LPE）。</li>
</ul>
</li>
<li><strong>方法的时效性：</strong>
