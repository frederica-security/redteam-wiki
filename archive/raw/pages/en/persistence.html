<blockquote>
<p><strong>所有的攻击都是暂时的。</strong></p>
</blockquote>
<p>如果管理员重启了服务器，或者随手关掉了我们的程序，之前的努力就全部白费了。我们必须重头再来——这在实战中是不可接受的。</p>
<p><strong>“持久化 (Persistence)”</strong>，就像是在游戏里“存档”。我们的目标是：<strong>无论系统重启多少次，无论管理员做什么，我们的后门都能自动、隐蔽地复活。</strong></p>
<p>我们将通过四个等级，教你如何把你的“恶意代码”植入 Windows 的每一个角落。</p>
<hr>
<h3 id="第一层-把名字写在开机清单上" class="toc-header"><a class="toc-anchor" href="#第一层-把名字写在开机清单上">¶</a> 第一层： “把名字写在开机清单上”</h3>
<p><em>原理简单，但也最容易被杀毒软件发现。</em></p>
<p>Windows 系统启动时，会按照一张“清单”逐个运行程序（比如你的微信、QQ自动启动）。黑客最直观的做法，就是把自己的马（Backdoor）加到这张清单里。</p>
<h4 id="h-1-注册表自启动-registry-run-keys" class="toc-header"><a class="toc-anchor" href="#h-1-注册表自启动-registry-run-keys">¶</a> 1. 📝 注册表自启动 (Registry Run Keys)</h4>
<p>这是最经典的手段。Windows 注册表里有几个特定的位置（键值），专门用来存放开机启动项。</p>
<ul>
<li><strong>位置：</strong> <code>HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run</code></li>
<li><strong>操作：</strong> 只要在这里添加一行，写上我们木马的路径（例如 <code>C:\temp\backdoor.exe</code>），下次开机它就会自动运行。</li>
<li><strong>缺点：</strong> 太招摇了。几乎所有的杀毒软件（AV）和运维工具（如 360、火绒）都会死死盯着这里。</li>
</ul>
<h4 id="h-2-启动文件夹" class="toc-header"><a class="toc-anchor" href="#h-2-启动文件夹">¶</a> 2. 📂 启动文件夹</h4>
<p>这就更简单了，直接把木马的快捷方式扔进 <code>C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp</code> 文件夹里。效果一样，也很容易被发现。（不过，某个常见的杀毒软件竟然不检测特定的后缀名！！）</p>
<p>当然还有用户自己的启动目录，它甚至不要管理员权限就可以写入 <code>C:\Users\username\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup</code></p>
<hr>
<h3 id="第二层伪装成系统的勤杂工" class="toc-header"><a class="toc-anchor" href="#第二层伪装成系统的勤杂工">¶</a> 第二层：“伪装成系统的勤杂工”</h3>
<p><em>利用系统自带的合法功能，混淆视听。</em></p>
<h4 id="h-1-计划任务-scheduled-tasks" class="toc-header"><a class="toc-anchor" href="#h-1-计划任务-scheduled-tasks">¶</a> 1. ⏰ 计划任务 (Scheduled Tasks)</h4>
<p>Windows 有一个“闹钟”功能，叫<strong>任务计划程序 (Task Scheduler)</strong>。它原本是用来定时更新系统或清理垃圾的。</p>
<ul>
<li><strong>简单的思路：</strong> 我们可以创建一个任务，设定为<strong>每当用户登录时</strong>或<strong>每隔30分钟</strong>，就偷偷运行我们的脚本。</li>
<li><strong>隐蔽性：</strong> 我们可以把任务起名为 <code>GoogleUpdate</code> 或 <code>WindowsSystemCheck</code>，看起来人畜无害，很难引起管理员的怀疑。</li>
</ul>
<h4 id="h-2-️-系统服务-services" class="toc-header"><a class="toc-anchor" href="#h-2-️-系统服务-services">¶</a> 2. ⚙️ 系统服务 (Services)</h4>
<p>服务是 Windows 的核心组件，它们在后台默默运行，甚至不需要用户登录。</p>
<ul>
<li><strong>简单的思路：</strong>
<ul>
<li><strong>新建服务：</strong> 创建一个叫 <code>Windows Health Monitor</code> 的假服务，实际上运行的是后门。</li>
<li><strong>服务劫持：</strong> 找到一个合法的服务，修改它的配置，让它启动时顺便加载我们的恶意 DLL。</li>
</ul>
</li>
<li><strong>优势：</strong> 权限极高（通常是 SYSTEM 权限），且很难被手动关闭。</li>
</ul>
<hr>
<h3 id="第三层劫持系统的守门人" class="toc-header"><a class="toc-anchor" href="#第三层劫持系统的守门人">¶</a> 第三层：“劫持系统的守门人”</h3>
<p><em>修改系统核心流程，让系统主动帮我们运行。</em></p>
<h4 id="h-1-winlogon-登录劫持" class="toc-header"><a class="toc-anchor" href="#h-1-winlogon-登录劫持">¶</a> 1. Winlogon 登录劫持</h4>
<p><code>Winlogon.exe</code> 是负责管理用户登录过程的关键进程。当你在输入密码时，它就在工作。</p>
<ul>
<li><strong>原理：</strong> 注册表中有一个 <code>Userinit</code> 键值，它规定了用户登录后要运行什么程序（通常是 <code>userinit.exe</code>）。</li>
<li><strong>手法：</strong> 我们在后面加个“尾巴”。把键值改为 <code>userinit.exe, C:\hacker\backdoor.exe</code>。</li>
<li><strong>效果：</strong> 每次用户输入密码进入桌面之前，系统都会先贴心地帮我们把后门打开。</li>
</ul>
<h4 id="h-2-dll-劫持-dll-hijacking" class="toc-header"><a class="toc-anchor" href="#h-2-dll-劫持-dll-hijacking">¶</a> 2. DLL 劫持 (DLL Hijacking)</h4>
<p>这是利用了 Windows 的“懒惰”。当一个程序（比如 <code>notepad.exe</code>）需要用一个功能库（DLL）时，它会按照顺序去几个目录里找。</p>
<ul>
<li><strong>手法：</strong> 假设程序需要 <code>version.dll</code>。我们自己写一个恶意的 <code>version.dll</code>，放在程序运行的目录下。程序一启动，发现旁边就有个 <code>version.dll</code>，看都不看就直接加载了——<strong>Bingo，代码执行。</strong></li>
<li><strong>应用：</strong> 这种方法非常隐蔽，属于“借尸还魂”，不过需要转发dll的函数，防止程序的正常功能受到影响。</li>
</ul>
<h4 id="h-3-com-劫持" class="toc-header"><a class="toc-anchor" href="#h-3-com-劫持">¶</a> 3. COM 劫持</h4>
<p>Windows 里的很多软件组件（COM对象）是通过注册表里的 ID (CLSID) 来索引的。</p>
<ul>
<li><strong>手法：</strong> 我们修改注册表，把某个常用组件（比如打开文件时会用到的组件）的路径，替换成我们的恶意文件路径。当用户只是简单地浏览文件夹时，后门就触发了。</li>
</ul>
<hr>
<h3 id="第四层无文件攻击与隐形陷阱" class="toc-header"><a class="toc-anchor" href="#第四层无文件攻击与隐形陷阱">¶</a> 第四层：“无文件攻击与隐形陷阱”</h3>
<p><em>不在硬盘上留下痕迹，或者深埋于系统底层。</em></p>
<h4 id="h-1-wmi-windows-management-instrumentation" class="toc-header"><a class="toc-anchor" href="#h-1-wmi-windows-management-instrumentation">¶</a> 1. 👻 WMI (Windows Management Instrumentation)</h4>
<p>这是目前红队最喜欢的<strong>无文件攻击</strong>手段之一。WMI 是 Windows 强大的管理框架。</p>
<ul>
<li><strong>原理：</strong> WMI 允许我们设置<strong>事件订阅 (Event Subscription)</strong>。这就像埋设地雷：我们可以设定“当系统启动 2 分钟后”或者“当某个文件被创建时”，触发一段 PowerShell 代码。</li>
<li><strong>优势：</strong> <strong>没有文件落地！</strong> 恶意代码直接存储在 WMI 数据库里，硬盘上找不到 <code>.exe</code> 文件，传统的杀毒软件很难查杀。</li>
</ul>
<h4 id="h-2-️-bootkit-mbr-后门" class="toc-header"><a class="toc-anchor" href="#h-2-️-bootkit-mbr-后门">¶</a> 2. ☠️ Bootkit (MBR 后门)</h4>
<p>这是终极的大招，但现在很难见到了。不过，最近又出现了一些巧妙的APT野外利用，值得学习 <a href="https://www.kaspersky.com.cn/about/press-releases/more-elusive-and-more-persistent" class="is-external-link">https://www.kaspersky.com.cn/about/press-releases/more-elusive-and-more-persistent</a></p>
<ul>
<li><strong>原理：</strong> 修改硬盘的<strong>主引导记录 (MBR)</strong>。</li>
<li><strong>效果：</strong> 你的病毒运行得<strong>比操作系统还要早</strong>。当 Windows 还在加载 Logo 的时候，病毒已经控制了电脑。不过，随着 UEFI 安全启动的普及，这种古老的魔法正在失效。</li>
</ul>
<hr>
<h3 id="️-防御者视角如何把这些客人赶走" class="toc-header"><a class="toc-anchor" href="#️-防御者视角如何把这些客人赶走">¶</a> 🛡️ 防御者视角：如何把这些客人赶走？</h3>
<p>作为防御者，他们如何检测我们的行动？</p>
<ol>
<li><strong>使用神器 Autoruns：</strong> 微软官方工具 Sysinternals Suite 中的 <code>Autoruns</code> 是检测持久化的神器。它可以扫描上述提到的<strong>几乎所有</strong>启动位置（注册表、服务、计划任务、DLL劫持点等）。</li>
<li><strong>监控进程父子关系：</strong> 正常的 <code>svchost.exe</code> 是由 <code>services.exe</code> 启动的。如果你发现一个 <code>powershell.exe</code> 突然启动了一个不明程序，那通常有问题。</li>
<li><strong>定期排查计划任务和 WMI：</strong> 不要只看启动文件夹，那里通常是空的。定期的深度扫描才是关键。</li>
</ol>
