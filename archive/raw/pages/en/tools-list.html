<p><strong>⚠️ 警告：保命须知</strong></p>
<ol>
<li><strong>虚拟机原则：</strong> 本列表中提到的所有工具，<strong>必须且只能</strong>在虚拟机（VMware/VirtualBox）中运行。绝不要在宿主机上安装或运行任何攻防工具。</li>
<li><strong>来源警示：</strong> 对于 Cobalt Strike 等商业软件，市面上流传的“破解版”<strong>极大概率含有后门</strong>。请务必保持警惕，我们仅提供官方链接，使用非官方版本后果自负。</li>
<li><strong>法律边界：</strong> 所有工具仅限用于授权的红队演习、靶场训练或 CTF 比赛。</li>
</ol>
</blockquote>
<h3 id="️-基础设施与环境" class="toc-header"><a class="toc-anchor" href="#️-基础设施与环境">¶</a> 🏗️ 基础设施与环境</h3>
<p>搭建一个安全、可控的实验环境是红队行动的第一步。</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">工具名称</th>
<th style="text-align:left">用途</th>
<th style="text-align:left">官方/项目地址</th>
<th style="text-align:left">备注</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>VMware Workstation</strong></td>
<td style="text-align:left">虚拟机软件</td>
<td style="text-align:left"><a href="https://www.vmware.com/products/workstation-pro.html" class="is-external-link">官网</a></td>
<td style="text-align:left"><strong>必备。</strong> 建议使用 Pro 版本以便于网络配置（如仅主机模式）。</td>
</tr>
<tr>
<td style="text-align:left"><strong>VirtualBox</strong></td>
<td style="text-align:left">虚拟机软件</td>
<td style="text-align:left"><a href="https://www.virtualbox.org/" class="is-external-link">官网</a></td>
<td style="text-align:left">免费开源的替代方案。</td>
</tr>
<tr>
<td style="text-align:left"><strong>Commando VM</strong></td>
<td style="text-align:left">Windows 攻击机环境</td>
<td style="text-align:left"><a href="https://github.com/mandiant/commando-vm" class="is-external-link">GitHub</a></td>
<td style="text-align:left">Mandiant 出品的脚本，能把纯净的 Windows 变成全功能的攻击机。</td>
</tr>
<tr>
<td style="text-align:left"><strong>Docker</strong></td>
<td style="text-align:left">容器服务</td>
<td style="text-align:left"><a href="https://www.docker.com/" class="is-external-link">官网</a></td>
<td style="text-align:left">快速搭建靶场（如 Vulfocus）或隔离运行工具。</td>
</tr>
<tr>
<td style="text-align:left"><strong>Visual Studio</strong></td>
<td style="text-align:left">C/C++ 开发环境</td>
<td style="text-align:left"><a href="https://visualstudio.microsoft.com/" class="is-external-link">官网</a></td>
<td style="text-align:left"><strong>开发 Loader 必备</strong>。建议安装“C++ 桌面开发”组件。</td>
</tr>

<h3 id="辅助工具-技能补充" class="toc-header"><a class="toc-anchor" href="#辅助工具-技能补充">¶</a> 🚩 辅助工具 (技能补充)</h3>
<p>虽然 Red Team 更侧重实战，但部分工具在特定场景（如 Web 漏洞挖掘、逆向分析、流量取证）中依然非常有用。</p>
<h4 id="web-安全" class="toc-header"><a class="toc-anchor" href="#web-安全">¶</a> 🌐 Web 安全</h4>
<ul>
<li><strong>Burp Suite:</strong> <a href="https://portswigger.net/burp" class="is-external-link">官网</a> - 这里的绝对核心，代理、抓包、重放。</li>
<li><strong>SQLMap:</strong> <a href="https://github.com/sqlmapproject/sqlmap" class="is-external-link">GitHub</a> - 自动化 SQL 注入工具。</li>
<li><strong>Dirsearch:</strong> <a href="https://github.com/maurosoria/dirsearch" class="is-external-link">GitHub</a> - 目录爆破工具。</li>
<li><strong>Hackbar:</strong> [浏览器插件] - 快速修改 HTTP 请求参数。</li>
<li><strong>AntSword (蚁剑):</strong> <a href="https://github.com/AntSwordProject/antSword" class="is-external-link">GitHub</a> - 开源 Webshell 管理工具。</li>
</ul>
<h4 id="逆向与-pwn" class="toc-header"><a class="toc-anchor" href="#逆向与-pwn">¶</a> 💫 逆向与 Pwn</h4>
<ul>
<li><strong>IDA Pro / Free:</strong> <a href="https://hex-rays.com/ida-free/" class="is-external-link">官网</a> - 静态反汇编神器。</li>
<li><strong>Ghidra:</strong> <a href="https://ghidra-sre.org/" class="is-external-link">官网</a> - NSA 开源的逆向工具，免费且强大。</li>
<li><strong>x64dbg:</strong> <a href="https://x64dbg.com/" class="is-external-link">官网</a> - Windows 下优秀的动态调试器。</li>
<li><strong>Pwntools:</strong> <a href="https://github.com/Gallopsled/pwntools" class="is-external-link">GitHub</a> - 编写 Pwn 题 Exp 的 Python 库，实战中也可用于写二进制漏洞利用脚本。</li>
</ul>
<h4 id="流量与杂项" class="toc-header"><a class="toc-anchor" href="#流量与杂项">¶</a> 📡 流量与杂项</h4>
<ul>
<li><strong>Wireshark:</strong> <a href="https://www.wireshark.org/" class="is-external-link">官网</a> - 流量分析。实战中用于分析异常流量或调试 C2 协议。</li>
<li><strong>CyberChef:</strong> <a href="https://gchq.github.io/CyberChef/" class="is-external-link">官网</a> - 瑞士军刀般的编解码工具，处理 Base64、Hex 等数据极其方便。</li>
</ul>
<hr>
<h3 id="食用指南" class="toc-header"><a class="toc-anchor" href="#食用指南">¶</a> 💡 食用指南</h3>
<ol>
<li><strong>按需下载：</strong> 不要试图下载所有工具。根据你当前的任务（是打 Web、是做内网渗透、还是写 Loader）来选择工具。</li>
<li><strong>工具箱化：</strong> 建议在虚拟机中维护一个自己的 <code>Tools</code> 目录，将常用工具分类存放（如 <code>Scan</code>, <code>Exploit</code>, <code>C2</code>, <code>Tunnel</code>）。</li>
<li><strong>保持更新：</strong> 攻防技术迭代极快，定期去 GitHub 检查工具的更新，关注新的 Issue 和功能。</li>
</ol>
