<p>很多新手拿到目标后的第一反应是：打开工具，对着主站一顿乱扫。<br>
🔴 <strong>结果：</strong> 3 秒后被防火墙（WAF）拉黑，连登录框都没见到，游戏结束。</p>
<p><strong>资产测绘（Asset Mapping）</strong> 就是在攻击开始前，绘制一张目标的“全景地图”。你的目标不是去撞最硬的墙，而是找到那扇忘记上锁的窗。</p>
<hr>
<h2 id="h-2-什么是资产-your-targets" class="toc-header"><a class="toc-anchor" href="#h-2-什么是资产-your-targets">¶</a> 2. 什么是“资产”？ (Your Targets) 🎯</h2>
<p>在网络世界里，资产不仅仅是钱，而是<strong>目标在互联网上拥有的所有“触点”</strong>。只要是能通网的，都可能是突破口。</p>
<h3 id="️-域名-domain" class="toc-header"><a class="toc-anchor" href="#️-域名-domain">¶</a> 🏛️ 域名 (Domain)</h3>
<p>就像房子的招牌（如 <code>example.com</code>）。</p>
<ul>
<li><strong>重点关注：子域名 (Subdomains)</strong>
<ul>
<li>主站 (<code>www</code>) 通常防御最严密。</li>
<li>但开发服 (<code>dev</code>)、测试服 (<code>test</code>)、旧版系统 (<code>old</code>)、VPN 入口 (<code>vpn</code>) 往往是防御的<strong>短板</strong>。</li>
</ul>
</li>
</ul>
<h3 id="ip-地址-ip-address" class="toc-header"><a class="toc-anchor" href="#ip-地址-ip-address">¶</a> 🏠 IP 地址 (IP Address)</h3>
<p>就像房子的门牌号（如 <code>203.0.113.10</code>）。</p>
<ul>
<li>有时候域名套了 CDN（内容分发网络，相当于保护罩），你打的是 CDN 节点而不是真实服务器。找到<strong>真实 IP</strong> 也是测绘的重要一环。</li>
</ul>
<hr>
<h2 id="h-3-必须要懂的网络基础b-段与-c-段" class="toc-header"><a class="toc-anchor" href="#h-3-必须要懂的网络基础b-段与-c-段">¶</a> 3. 必须要懂的网络基础：B 段与 C 段 🌐</h2>
<p>新手经常听到老手说：“扫一下它的 C 段”。这是什么意思？</p>
<p>IP 地址通常长这样：<code>192.168.1.10</code> (A.B.C.D)。我们可以把它想象成行政区划：</p>
<ul>
<li>
<p><strong>C 段 (C-Class / /24)：</strong></p>
<ul>
<li>指 IP 的前三段相同，只有最后一段不同。</li>
<li><strong>例子：</strong> 目标 IP 是 <code>1.1.1.10</code>，它的 C 段邻居是 <code>1.1.1.1</code> 到 <code>1.1.1.255</code>。</li>
<li><strong>红队视角：</strong> 企业通常会买一整段连续的 IP。如果 <code>1.1.1.10</code> 是防御森严的主站，那么住在隔壁的 <code>1.1.1.11</code> 很可能就是一台<strong>没有任何防护的测试服务器</strong>。拿下邻居，就等于进入了内网小区。</li>
</ul>
</li>
<li>
<p><strong>B 段 (B-Class / /16)：</strong></p>
<ul>
<li>指 IP 的前两段相同（范围更大）。</li>
<li>通常只有超大型互联网公司或集团才会拥有 B 段资产。扫描 B 段耗时较长，但能发现更多边缘资产。</li>
</ul>
</li>
</ul>
<hr>
<h2 id="h-4-dns-解析互联网的电话本" class="toc-header"><a class="toc-anchor" href="#h-4-dns-解析互联网的电话本">¶</a> 4. DNS 解析：互联网的电话本 📖</h2>
<ul>
<li><strong>概念：</strong> 电脑记不住 <code>www.google.com</code> 这种单词，它只认识 IP。DNS 就是把“域名”翻译成“IP”的服务。</li>
<li><strong>A 记录：</strong> 域名对应的 IPv4 地址。</li>
<li><strong>CNAME：</strong> 域名的别名（常用于识别是否使用了 CDN）。</li>
<li><strong>DNS域传送漏洞：</strong> 由于dns配置不当，本来只有备份服务器能获得主服务器的数据，由于漏洞导致任意client都能通过“域传送”获得主服务器的数据。</li>
<li><strong>红队技巧：</strong> 查看 DNS 历史记录（Historical DNS）。有时现在的域名解析到了高防 IP，但半年前的历史记录可能暴露了它的<strong>真实源站 IP</strong>。</li>
</ul>
<hr>
<h2 id="h-5-指纹识别-fingerprinting这是什么材料做的" class="toc-header"><a class="toc-anchor" href="#h-5-指纹识别-fingerprinting这是什么材料做的">¶</a> 5. 指纹识别 (Fingerprinting)：这是什么材料做的？ 🔍</h2>
<p>找到了房子（IP/域名），你还得知道这房子是用什么材料盖的。</p>
<ul>
<li><strong>Web 指纹：</strong> 网站是用什么技术写的？
<ul>
<li>如果你识别出目标用的是 <strong>WordPress</strong>，你就去搜 WordPress 的漏洞。</li>
<li>如果你识别出目标用的是 <strong>Java (Spring Boot)</strong>，你就去测试 Java 反序列化漏洞。</li>
</ul>
</li>
<li><strong>端口指纹：</strong> 只有 80/443 端口（网页）吗？
<ul>
<li>开放了 <strong>3389</strong>？那是远程桌面，可以尝试爆破密码。</li>
<li>开放了 <strong>3306</strong>？那是 MySQL 数据库，可能存在弱口令。</li>
</ul>
</li>
</ul>
<hr>
<h2 id="h-6-高级侦察通过特征寻找隐藏目标-️️" class="toc-header"><a class="toc-anchor" href="#h-6-高级侦察通过特征寻找隐藏目标-️️">¶</a> 6. 高级侦察：通过“特征”寻找隐藏目标 🕵️‍♀️</h2>
<p>有些资产没有绑定明显的域名，或者藏在云服务器里，怎么找到它们？这时候要用“侧写”技术。</p>
<h3 id="️-favicon-hash-图标哈希" class="toc-header"><a class="toc-anchor" href="#️-favicon-hash-图标哈希">¶</a> 🖼️ Favicon Hash (图标哈希)</h3>
<p><strong>原理：</strong> 每个网站浏览器标签页上的那个小图标（Favicon.ico），在代码里都是一串特定的二进制数据。我们可以计算这串数据的“指纹”（Hash 值）。<br>
<strong>实战：</strong></p>
<ol>
<li>计算目标主站图标的 Hash 值。</li>
<li>在网络空间搜索引擎（如 Shodan/Fofa）里搜索这个 Hash。</li>
<li><strong>惊喜：</strong> 你可能会发现几十个 IP 使用了完全相同的图标。这些 IP 即使没有绑定域名，也大概率是属于同一家公司的（比如后台管理系统、开发测试环境）。</li>
</ol>
<h3 id="https-数字证书-ssl-certificate" class="toc-header"><a class="toc-anchor" href="#https-数字证书-ssl-certificate">¶</a> 📜 HTTPS 数字证书 (SSL Certificate)</h3>
<p><strong>原理：</strong> 为了实现 HTTPS 加密，网站必须安装证书。证书里包含“颁发给谁”的信息（Organization 或 Common Name）。<br>
<strong>实战：</strong></p>
<ol>
<li>查看目标网站的证书信息，比如“颁发给：Jack Corp”。</li>
<li>搜索所有证书中包含“Jack Corp”的 IP 地址。</li>
<li><strong>惊喜：</strong> 你能找到所有属于该公司的服务器，哪怕它们仅仅是一个跑在 AWS 上、只有 IP 的测试接口。</li>
</ol>
<hr>
<h2 id="h-7-为什么要这么做一个关于封-ip的教训" class="toc-header"><a class="toc-anchor" href="#h-7-为什么要这么做一个关于封-ip的教训">¶</a> 7. 为什么要这么做？一个关于“封 IP”的教训 🚫</h2>
<p>为什么新手总是还没开始就被封号，而老手却能从容进出？</p>
<h3 id="新手剧本正面硬刚" class="toc-header"><a class="toc-anchor" href="#新手剧本正面硬刚">¶</a> ❌ 新手剧本：正面硬刚</h3>
<ol>
<li>锁定目标主站 <code>www.target.com</code>。</li>
<li>开启全端口扫描器，速度拉满。</li>
<li><strong>结局：</strong> 目标的 WAF（Web 应用防火墙）检测到高频流量，判定为攻击，直接封禁你的 IP。你什么都没得到，还暴露了自己的意图。</li>
</ol>
<h3 id="高手剧本寻找软柿子" class="toc-header"><a class="toc-anchor" href="#高手剧本寻找软柿子">¶</a> ✅ 高手剧本：寻找“软柿子”</h3>
<ol>
<li><strong>资产测绘：</strong> 通过子域名挖掘和证书查询，发现目标有一个新上线的业务 <code>beta-shop.target.com</code>，以及同 C 段的一个 <code>192.168.x.x</code> 的测试服务器。</li>
<li><strong>分析：</strong> 这个新业务（New Biz）刚上线，为了调试方便，可能<strong>关掉了防火墙</strong>；而那个 C 段的 IP 可能是个旧系统（Legacy），没人维护。</li>
<li><strong>进攻：</strong> 避开主站，直接攻击这个边缘的测试系统。</li>
<li><strong>结局：</strong> 轻松拿到权限，并以此为跳板，从内部渗透进主站网络。</li>
</ol>
<blockquote>
<p>💡 <strong>总结：</strong> 资产测绘的核心目的，是避开防守最严密的正门，找到那个被管理员遗忘的、缺乏维护的、或者正在测试的<strong>脆弱入口</strong>。</p>
</blockquote>
