<h3 id="回顾我们到底在做什么" class="toc-header"><a class="toc-anchor" href="#回顾我们到底在做什么">¶</a> 回顾：我们到底在做什么？</h3>
<p>在上一个大章节《木马 - 一切行动的基石》中，我们学会了：</p>
<ul>
<li>如何生成 Beacon</li>
<li>如何上线并控制目标机器</li>
<li>如何致盲 EDR</li>
<li>如何清理痕迹</li>
</ul>
<p><strong>但所有这些技术，都依赖于一个基本的事实：</strong></p>
<blockquote>
<p>目标正在运行着我们的 <code>.exe</code> 文件</p>
</blockquote>
<p>想象这个场景：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">你精心制作了一个 Beacon：
✅ 免杀处理完美
✅ 混淆了所有特征
✅ C2 基础设施完备
✅ 权限维持方案齐全

但是...

❌ 你无法让目标双击运行它
</code></pre>
<p><strong>这就像一把锁匠精心打磨的万能钥匙，却无法塞进锁孔。</strong></p>
<hr>
<h3 id="本章的核心问题" class="toc-header"><a class="toc-anchor" href="#本章的核心问题">¶</a> 🎯 本章的核心问题</h3>
<p><strong>如何在对方的办公电脑上，执行我们的木马？</strong></p>
<p>这个问题有三个关键维度：</p>
<ol>
<li><strong>投递方式：</strong> 怎么把木马送到目标手里？</li>
<li><strong>伪装技术：</strong> 怎么让木马看起来"无害"？</li>
<li><strong>心理战术：</strong> 怎么让目标愿意打开它？</li>
</ol>
