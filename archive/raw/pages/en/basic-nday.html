<p>谈起一次成功的红队行动或者黑客攻击，大多数人的第一反应是训练有素的专业人士利用极其先进的攻击手段/极其新颖的漏洞和精心策划与潜伏，发起的一次成本高昂的行动。但是实际情况很可能只是——惨遭加班过度的管理员忘记查阅某个软件包的安全公告，因此没有及时给某个已被公开的漏洞安装补丁。<br>
在真实场景中，这种情况并不少见，甚至不乏某些知名企业也因此遭受了惨重的实际损失。所谓的Nday利用，正是使用目前已经公开发布的漏洞发起攻击。<br>
Nday是区别于0day和1day的概念。<br>
首先，在了解了前面的基础Web漏洞之后，不难理解0day漏洞的概念：某个漏洞被某个黑客发现，并且该黑客不公开/不上报漏洞，外界并不知道这个漏洞的存在，因此软件开发者也无法为该漏洞制作补丁。这种情况下的攻击称之为0day攻击（在野利用），难以防御。<br>
1day漏洞则是漏洞已经遭到披露，可能是被漏洞发现者上报或者由于在野利用过程中被捕获（因此，使用0day是一项有风险的行为，因为有概率被捕获漏洞细节），但是软件开发者还没有为此制作补丁。<br>
Nday漏洞则是漏洞已经公开，且已有补丁，因此绝大部分Nday在真实环境都已被修复。但是由于现代软件纷繁复杂的架构，漏网之鱼并不鲜见。一旦我们发现了目标组织存在某个Nday漏洞，利用Nday发起攻击几乎没有成本——不需要处心积虑收集人员信息来钓鱼，也不需要使用成本高昂且珍贵的0day漏洞，大部分情况下只需要复制粘贴现有的exp（漏洞利用代码）即可。</p>
<blockquote>
<p>补充：<br>
exp（漏洞利用代码）：利用漏洞获取权限或实现某些目的的代码。<br>
poc（概念验证代码）：与exp相对，它往往是漏洞验证阶段被临时编写出来的，一般仅仅只是能验证漏洞的存在，利用过程可能不稳定，或者只能实现受限功能（例如只能在有漏洞的机器上弹出计算器）<br>
payload（载荷）：被发送出去的那部分数据。exp和poc可以理解为导弹发射台，负责根据需求组建完整的payload并有效投送，payload则是导弹本身。<br>
CVE：一个站点，归档并索引了目前互联网上公开的各种漏洞并赋予编号。</p>
</blockquote>
<hr>
<p>在较大的组织中，安全管理是一项浩瀚的工程。试想一下，你是一家金融公司的IT负责人，公司在每个地区的分公司都有大量的各种部门，每个部门都有自己需要的数字化系统，每个系统都引入了不同的软件包和组件……这基本上是一场噩梦。</p>
<p>这样，我们就很容易理解某些Nday从何而来了。</p>
<p>举个实际例子：小白正在编写一个JavaWeb站点，他使用目前主流的技术栈，但是为了匹配网上的资料，他在pom.xml（Java项目配置文件，第三方依赖组件等索引就存储在其中）中引入的许多组件实际上并不是安全的版本。<br>
小白引入了某个json处理库组件，能够方便的转换json请求和java对象，而这个json库只是他项目中几十个组件中的一个不起眼的角落。<br>
该站点部署后，小黑通过Burpsuite的插件扫描到了这个有漏洞版本的组件，构造特定的payload进行攻击，获取了小白站点的管理员权限。</p>
<p>另一个例子：某所高校需要开发自己的子域名站点，用于教学质量评估，但是负责该项目的外包公司人手有限，于是选择了某个php框架来进行快速开发（例如Laravel，Yii，TP等，都是很知名的框架，可以极大提高开发效率）。但是站点上线之后很长时间没有维护，由于该框架被挖出某个RCE漏洞，校方信息化部门对此不知情，也就并没有更新补丁，最终该漏洞被恶意攻击者利用，造成内网沦陷。</p>
<p>还有一个例子：更加直接的例子是，目前互联网上还有大量使用CMS（内容管理系统）直接部署的站点，CMS是可以直接部署在服务器上的现成代码，例如Wordpress等。一旦CMS直接被爆出存在漏洞，那么使用该CMS的站点就全部暴露在被攻击的风险之中。</p>
<p>很多时候Nday就是类似这样的场景。</p>
<h3 id="scriptkid的自我修养" class="toc-header"><a class="toc-anchor" href="#scriptkid的自我修养">¶</a> ScriptKid的自我修养</h3>
<p>很显然，光是了解漏洞从何而来，而不知如何利用，是不够的。<br>
由于本wiki仅分享知识的基本宗旨，本页面不会提供可在真实场景直接使用的代码。但是，这不妨碍引用一些在互联网上知名的公开站点的资料。其中有些资料甚至被集成在Kali Linux之类的渗透发行版之中。<br>
最知名的站点当属github了。有时候找到某个系统疑似是旧版，于是使用Google搜索XX系统XX版本漏洞，或者搜索CVE编号，就能找到热心网友发布在github上的exp。<br>
其次是exploit-db，它同时也作为searchsploit工具被集成在Kali Linux中。可以方便地搜索漏洞信息。<br>
然后是各种集成工具，例如MetasploitFramework（MSF），其内置了大量exp。github也能找到许多针对特定场景的利用工具，实际上也是exp集合，例如针对部分常见OA系统等专门渗透场景的工具。</p>
