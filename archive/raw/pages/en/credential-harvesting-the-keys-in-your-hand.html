<p>凭证就像是您在目标网络中自由穿梭所需的各种“数字钥匙”。获取它们，比暴力破解密码要快得多、隐蔽得多。</p>
<p>本章，我们将聚焦于如何从 Windows 主机上窃取不同类型的钥匙，并解释为什么有些钥匙比另一些更有价值。</p>
<hr>
<h3 id="h-1-凭证的分类与价值排序" class="toc-header"><a class="toc-anchor" href="#h-1-凭证的分类与价值排序">¶</a> 1. 凭证的分类与价值排序</h3>
<p>我们将在目标主机上寻找以下三类核心凭证，并按照其在实战中的“快速通行”价值进行排序：</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">价值排序</th>
<th style="text-align:left">凭证类型</th>
<th style="text-align:left">价值概述</th>
<th style="text-align:left">实战效果</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>🥇 最高</strong></td>
<td style="text-align:left"><strong>会话凭据（Cookies/Token）</strong></td>
<td style="text-align:left">比如浏览器cookies，可以绕过登录密码和双因素认证（2FA），直接进入会话。</td>
<td style="text-align:left">极高，无需触碰密码。</td>
</tr>
<tr>
<td style="text-align:left"><strong>🥈 其次</strong></td>
<td style="text-align:left"><strong>系统凭据（Hash/Kerberos）</strong></td>
<td style="text-align:left">可用于横向移动。一旦拿到域管理员 Hash，即可控制整个网络。</td>
<td style="text-align:left">较高，通常需要 SYSTEM 权限。</td>
</tr>
<tr>
<td style="text-align:left"><strong>🥉 再次</strong></td>
<td style="text-align:left"><strong>应用密码（明文密码）</strong></td>
<td style="text-align:left">网站、邮箱、数据库等密码。虽然有价值，但使用时可能触发 2FA。</td>
<td style="text-align:left">较高，需要解密。</td>
</tr>
</tbody>
</table></div>
<h3 id="h-2-最高价值浏览器凭据与会话劫持" class="toc-header"><a class="toc-anchor" href="#h-2-最高价值浏览器凭据与会话劫持">¶</a> 2. 🔑 最高价值：浏览器凭据与会话劫持</h3>
<p>为什么浏览器凭据是最高价值？</p>
<blockquote>
<p><strong>原因：</strong> 如今大多数系统都开启了<strong>双因素认证 (2FA)</strong>。如果您拿到密码直接登录，目标手机就会收到短信或推送通知，<strong>打草惊蛇！</strong></p>
<p><strong>Cookie/Token 的作用：</strong> 它们代表了“用户已经通过验证”的当前会话状态。我们只需要拿到有效的 Cookie，就能跳过密码输入和 2FA 步骤，直接进入用户的邮箱、内网系统或 VPN 界面。</p>
</blockquote>
<p>Chromium 内核浏览器（Chrome、Edge）是我们的首要目标，它们将敏感数据加密存储在本地的数据库文件中。</p>
<h4 id="h-21-存储机制dpapi-与-v20-的演变" class="toc-header"><a class="toc-anchor" href="#h-21-存储机制dpapi-与-v20-的演变">¶</a> 2.1 存储机制：DPAPI 与 V20 的演变</h4>
<p>无论是存储的密码还是 Cookie，浏览器都使用一个<strong>主密钥 (Master Key)</strong> 进行加密。这个主密钥又被 Windows 的安全机制保护起来：</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">浏览器版本</th>
<th style="text-align:left">保护机制</th>
<th style="text-align:left">攻击原理</th>
<th style="text-align:left">隐蔽性</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>V10/V11 (旧版)</strong></td>
<td style="text-align:left">DPAPI 绑定用户凭据</td>
<td style="text-align:left">只要以<strong>相同用户身份</strong>运行，即可简单调用 Windows API 解密。</td>
<td style="text-align:left">低（操作简单，易被监控）。</td>
</tr>
<tr>
<td style="text-align:left"><strong>V20 (新版)</strong></td>
<td style="text-align:left">应用程序绑定加密</td>
<td style="text-align:left">密钥解密过程被转移到 <strong>SYSTEM 权限服务</strong>。只能通过 <strong>进程注入</strong> 或 <strong>内存转储</strong> 来获取。</td>
<td style="text-align:left">极高（需复杂的内存或进程操作）。</td>
</tr>
</tbody>
</table></div>
<p>对于入门者，最关键的知识点是：</p>
<blockquote>
<p>🚨 <strong>攻击目标不是加密文件本身，而是解密它的“钥匙”——主密钥。</strong></p>
</blockquote>
<h4 id="h-22-实战获取手段从磁盘到内存" class="toc-header"><a class="toc-anchor" href="#h-22-实战获取手段从磁盘到内存">¶</a> 2.2 实战获取手段：从磁盘到内存</h4>
<p>由于 Chrome V20 的加固，攻击手法也变得更专业：</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">手法</th>
<th style="text-align:left">目标</th>
<th style="text-align:left">优点</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>文件解密</strong></td>
<td style="text-align:left">V10 主密钥</td>
<td style="text-align:left">速度快，代码简单。适合老版本浏览器。</td>
</tr>
<tr>
<td style="text-align:left"><strong>内存转储 (Minidump)</strong></td>
<td style="text-align:left">正在运行的 Chrome 进程内存</td>
<td style="text-align:left">绕过 V20 磁盘加密。从内存中直接提取已解密的主密钥或明文数据。</td>
</tr>
<tr>
<td style="text-align:left"><strong>进程注入/劫持</strong></td>
<td style="text-align:left">V20 解密服务</td>
<td style="text-align:left">模拟合法 Chrome 进程去向 <strong>SYSTEM 服务</strong>请求解密密钥。</td>
</tr>
<tr>
<td style="text-align:left"><strong>CDP 窃取</strong></td>
<td style="text-align:left">Chrome 调试端口</td>
<td style="text-align:left">适合特定场景（如应用基于 Electron），直接通过 Web 协议获取当前会话的 Cookie。</td>
</tr>
</tbody>
</table></div>
<hr>
<h3 id="h-3-️-其次价值系统凭据与横向移动" class="toc-header"><a class="toc-anchor" href="#h-3-️-其次价值系统凭据与横向移动">¶</a> 3. 🛡️ 其次价值：系统凭据与横向移动</h3>
<p>虽然浏览器凭据能让我们登录应用，但<strong>系统凭据</strong>才能让我们在整个内网中移动。</p>
<h4 id="h-31-lsa-subsystem-lsass" class="toc-header"><a class="toc-anchor" href="#h-31-lsa-subsystem-lsass">¶</a> 3.1 🔐 LSA Subsystem (LSASS)</h4>
<p><code>LSASS.exe</code> 是 Windows <strong>本地安全认证子系统</strong>的核心进程。当你输入密码登录后，Windows 会把你的 <strong>NTLM Hash</strong> 和 <strong>Kerberos 票据</strong>安全地存储在 LSASS 的内存中。</p>
<ul>
<li><strong>NTLM Hash：</strong> 密码的单向散列值，不能逆推出原始密码，但可以用于<strong>哈希传递 (Pass-the-Hash)</strong>，即无需密码即可登录其他机器。</li>
<li><strong>Kerberos 票据：</strong> 在域环境中，它相当于一张<strong>通行证</strong>，允许您在一定时间内访问域内的其他资源。</li>
</ul>
<h4 id="h-32-lsass-内存转储lsa-dump" class="toc-header"><a class="toc-anchor" href="#h-32-lsass-内存转储lsa-dump">¶</a> 3.2 LSASS 内存转储（LSA Dump）</h4>
<p>这是获取系统凭证的经典方法：</p>
<ol>
<li>利用我们已有的高权限（SYSTEM）。</li>
<li>将 <code>lsass.exe</code> 进程的内存完整地转储（Dump）成一个文件。</li>
<li>将文件带回自己的机器，用专业工具（如 <code>Mimikatz</code>）离线分析，提取出所有登录用户的 Hash 和票据。</li>
</ol>
