<h2 id="为什么要把目光投向im" class="toc-header"><a class="toc-anchor" href="#为什么要把目光投向im">¶</a> 为什么要把目光投向IM？</h2>
<h3 id="邮件易于留样难于挥发" class="toc-header"><a class="toc-anchor" href="#邮件易于留样难于挥发">¶</a> 邮件：易于留样，难于挥发</h3>
<p>咱们先聊聊邮件钓鱼面临的现实挑战。</p>
<p>邮件本身是<strong>静态、持久化</strong>的资产。一旦你的钓鱼邮件被安全网关捕获，样本就会被截留、沙箱分析，并迅速生成特征码，用于拦截后续的同源攻击。对于攻击者来说：</p>
<ul>
<li><strong>证据易留存：</strong> 邮件内容、附件和链接 URL 都会被企业的邮件归档系统（Archive）永久保存。</li>
<li><strong>防御集中化：</strong> 企业在邮件网关上投入巨大，防御手段集中且成熟。</li>
</ul>
<p><strong>IM 则拥有极佳的“挥发性”优势。</strong></p>
<p>IM 消息（尤其是像微信的“撤回”功能），可以在用户点击或被察觉后迅速清除痕迹。很多时候，攻击样本在被发现前就被删除，导致安全团队难以进行及时的恢复和取证。</p>
<h3 id="im-的使用边界和信任优势" class="toc-header"><a class="toc-anchor" href="#im-的使用边界和信任优势">¶</a> IM 的使用边界和信任优势</h3>
<p>IM 的覆盖范围远超企业内部 IM 的“同事私聊”，它有独特且更宽泛的攻击价值：</p>
<ul>
<li><strong>更广的覆盖面：</strong> 微信等应用深度覆盖了<strong>朋友关系、外部合作方</strong>，乃至许多<strong>中小型企业</strong>的核心办公场景，为攻击者提供了更丰富的社交工程入口。</li>
<li><strong>信任感拉满：</strong> 邮件是“陌生人的信件”，IM 则是“<strong>朋友或熟人发的</strong>”。这种天然的社交信任，是绕过人脑防御的第一道屏障。</li>
<li><strong>防御薄弱：</strong> 相较于邮件网关，企业在 IM 消息内容和客户端协议安全上的投入通常不足。</li>
</ul>
<blockquote>
<p><strong>核心认知：</strong> IM 攻击不再是简单的“发个钓鱼链接”，它利用的是现代办公流程中，信任的边界模糊和证据挥发性。</p>
</blockquote>
<hr>
<h2 id="自动下载最被低估的无声渗透" class="toc-header"><a class="toc-anchor" href="#自动下载最被低估的无声渗透">¶</a> 自动下载：最被低估的“无声渗透”</h2>
<h3 id="发生了什么你的电脑在偷偷收垃圾" class="toc-header"><a class="toc-anchor" href="#发生了什么你的电脑在偷偷收垃圾">¶</a> 发生了什么？你的电脑在偷偷“收垃圾”</h3>
<p>很多人可能没意识到，IM 客户端在接收文件时，经常会<strong>自动地、静默地将文件缓存到你的本地电脑上</strong>。你无需主动点击“另存为”。</p>
<blockquote>
<ul>
<li><strong>微信：</strong> 文件自动下到本地缓存目录。</li>
<li><strong>钉钉/飞书：</strong> 默认配置下，通常也会自动缓存到本地的 Download 或缓存目录。</li>
</ul>
</blockquote>
<h3 id="这意味着什么丝滑的攻击流程" class="toc-header"><a class="toc-anchor" href="#这意味着什么丝滑的攻击流程">¶</a> 这意味着什么？丝滑的攻击流程</h3>
<p>传统钓鱼需要用户进行多次不自然的操作（下载 → 解压 → 双击）。</p>
<p>利用自动下载，攻击流程变得异常<strong>丝滑</strong>：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">攻击者：发送伪装的文件（如“年终奖表格.xlsx.lnk”）
系统：文件自动下载到本地（用户无感知）
用户：看到文件 → 双击
结果：直接中招，整个过程没有下载、解压等反常操作。
</code></pre>
<h3 id="实战技巧用-lnk-执行图片文件中的shellcode" class="toc-header"><a class="toc-anchor" href="#实战技巧用-lnk-执行图片文件中的shellcode">¶</a> 实战技巧：用 LNK 执行图片文件中的shellcode</h3>
<p><strong>核心原理：</strong></p>
<ol>
<li>攻击者首先将恶意代码<strong>隐藏</strong>在一张正常的 <strong>JPG 图片</strong>文件的末尾。</li>
<li>发送该 JPG 文件到聊天窗口（JPG 看起来无害，通常不会被拦截，且会自动下载）。</li>
<li>发送一个 <strong>LNK 快捷方式文件</strong>，将其图标伪装成 Excel 或 Word 文档。</li>
<li>LNK 文件配置的执行命令是：<strong>读取那张已下载到本地的 JPG 文件末尾的代码，并执行。</strong></li>
</ol>
<p><strong>为什么有效？</strong></p>
<ul>
<li>规避了对可执行文件和压缩包的拦截。</li>
<li>用户交互少，双击就上线</li>
<li>不用右键解压，避免一些完全不懂解压的非技术人员，直接在软件中双击lnk（实战中经常出现，让你血压上升）</li>
</ul>
<hr>
<h2 id="外部群免费的侦察入口" class="toc-header"><a class="toc-anchor" href="#外部群免费的侦察入口">¶</a> 外部群：免费的侦察入口</h2>
<h3 id="场景混入协作群" class="toc-header"><a class="toc-anchor" href="#场景混入协作群">¶</a> 场景：混入协作群</h3>
<p>现在很多企业用 IM 客户端与外部供应商或合作方沟通，通常会创建 <strong>“外部协作群”</strong>。</p>
<p><strong>问题来了：</strong> 你作为外部人员混进群后，能看到什么？</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">信息类型</th>
<th style="text-align:left">可见性</th>
<th style="text-align:left">利用价值</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">公司内部聊天记录</td>
<td style="text-align:left">❌ 看不到</td>
<td style="text-align:left">-</td>
</tr>
<tr>
<td style="text-align:left"><strong>群成员列表</strong></td>
<td style="text-align:left">✅ 能看到</td>
<td style="text-align:left">组织架构侦察</td>
</tr>
<tr>
<td style="text-align:left"><strong>成员姓名/邮箱</strong></td>
<td style="text-align:left">✅ 能看到（取决于配置）</td>
<td style="text-align:left">精准钓鱼素材</td>
</tr>
<tr>
<td style="text-align:left"><strong>成员部门信息</strong></td>
<td style="text-align:left">✅ 能看到（取决于配置）</td>

<h3 id="实战利用绘制组织架构图" class="toc-header"><a class="toc-anchor" href="#实战利用绘制组织架构图">¶</a> 实战利用：绘制组织架构图</h3>
<p>企业认为“外部群是安全的”，但却忽略了 IM <strong>开放 API</strong> 可能存在的配置不当。攻击者可以利用这些公开接口对群成员信息进行枚举和收集。</p>
<p><strong>步骤：</strong></p>
<ol>
<li>找个理由混进外部群。</li>
<li>利用 <strong>IM 的 API</strong>（可能存在权限配置不当的问题）去<strong>枚举</strong>群成员的详细信息。</li>
<li>分析收集到的姓名、邮箱、部门信息，从而<strong>绘制</strong>目标公司的组织架构图。</li>
<li>根据职位（如 IT、财务）进行 <strong>精准定位钓鱼</strong>。</li>
</ol>
<blockquote>
<p><strong>核心思路：</strong> 外部协作群是一个绝佳的<strong>免费侦察入口</strong>，为后续的 OAuth 攻击和横向渗透提供了高质量的“人名/邮箱”清单。</p>
</blockquote>
<hr>
<h2 id="oauth-攻击扫码即授权点链接" class="toc-header"><a class="toc-anchor" href="#oauth-攻击扫码即授权点链接">¶</a> OAuth 攻击：扫码即“授权点链接”</h2>
<h3 id="先理解-oauth-是什么" class="toc-header"><a class="toc-anchor" href="#先理解-oauth-是什么">¶</a> 先理解 OAuth 是什么</h3>
<p>OAuth 流程让你授权第三方应用，访问你在 IM 平台上的部分信息。</p>
<blockquote>
<p><strong>关键点：</strong> 扫码授权 <strong>本质上</strong> 等同于你点击了一个特殊的授权链接。</p>
</blockquote>
<h3 id="攻击点-1劫持跳转地址-redirect-uri" class="toc-header"><a class="toc-anchor" href="#攻击点-1劫持跳转地址-redirect-uri">¶</a> 攻击点 1：劫持跳转地址 (Redirect URI)</h3>
<p>OAuth 流程中的一个关键参数是 <code>redirect_uri</code>，即授权码发送的目的地。</p>
<p><strong>攻击思路：</strong> 如果我能将这个 <code>redirect_uri</code> 参数改成我自己的恶意网站，就能直接截获授权码。</p>
<p><strong>完整攻击流程：</strong></p>
<ol>
<li>攻击者 IM 发消息：“系统升级，需要重新授权，请点击链接。”</li>
<li>受害者点击链接，进入真实的 IM 授权页面（信任度极高）。</li>
<li>受害者点“同意授权”。</li>
<li>IM 平台将授权码发送到 <strong>我的恶意网站</strong>。</li>
<li>攻击者用授权码换取永久访问令牌。</li>
<li><strong>结果：</strong> 攻击者现在能以受害者身份操作 IM 平台了。</li>
</ol>
<h3 id="攻击点-2授权页面-xss" class="toc-header"><a class="toc-anchor" href="#攻击点-2授权页面-xss">¶</a> 攻击点 2：授权页面 XSS</h3>
<ul>
<li><strong>场景：</strong> 某些 IM 平台的授权页面，可能因为开发者疏忽，对 URL 中的参数未进行严格过滤。</li>
<li><strong>攻击 Payload（概念）：</strong> 构造一个 OAuth 链接，在特定参数中注入 XSS 代码，使其在授权页面加载时触发。</li>
</ul>
<p><strong>结果：</strong></p>
<ol>
<li>用户点击恶意 OAuth 链接。</li>
<li>授权页面加载时，执行了注入的 JavaScript。</li>
<li>JavaScript 窃取用户的 Session Cookie 或 Token。</li>
<li>攻击者利用窃取的 Cookie 直接登录用户账号，<strong>完全绕过密码验证</strong>。</li>
</ol>
<hr>
<h2 id="客户端攻击从浏览器到操作系统" class="toc-header"><a class="toc-anchor" href="#客户端攻击从浏览器到操作系统">¶</a> 客户端攻击：从浏览器到操作系统</h2>
<h3 id="electron-的秘密披着软件外衣的网页" class="toc-header"><a class="toc-anchor" href="#electron-的秘密披着软件外衣的网页">¶</a> Electron 的秘密：披着软件外衣的网页</h3>
<p>现在的 IM 客户端很多都使用 <strong>Electron</strong> 框架开发。</p>
<ul>
<li><strong>Electron 是什么？</strong> 简单说就是“把网页包装成桌面软件”。</li>
<li><strong>危险在哪？</strong> 正常的网页，JavaScript 只能操作浏览器；而 Electron 客户端如果配置不当，<strong>前端 JavaScript 可以直接操作你的文件系统、执行系统命令！</strong></li>
</ul>
<h3 id="从-xss-到执行命令" class="toc-header"><a class="toc-anchor" href="#从-xss-到执行命令">¶</a> 从 XSS 到执行命令</h3>
<p><strong>如果客户端存在 XSS 漏洞，后果将是灾难性的：</strong></p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">环境</th>
<th style="text-align:left">XSS 攻击效果</th>
<th style="text-align:left">为什么？</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>普通网页</strong></td>
<td style="text-align:left">偷 Cookie，弹窗</td>
<td style="text-align:left">JavaScript 被限制在沙箱内。</td>
</tr>
<tr>
<td style="text-align:left"><strong>Electron 客户端</strong></td>
<td style="text-align:left">执行系统命令</td>
<td style="text-align:left">开发者启用了 <code>nodeIntegration</code> 配置。</td>
</tr>
</tbody>
</table></div>
<blockquote>
<p><strong>🔥 快速测试法：</strong><br>
在 IM 客户端的开发者工具（<code>Ctrl+Shift+I</code>）里输入 <code>typeof require</code>。如果返回 <code>'function'</code>，而不是 <code>'undefined'</code>，说明前端脚本被允许调用 Node.js 的功能，可能存在配置不当的问题。</p>
</blockquote>
<h3 id="协议劫持" class="toc-header"><a class="toc-anchor" href="#协议劫持">¶</a> 协议劫持</h3>
<p>IM 客户端会注册自定义协议（如 <code>dingtalk://</code>、<code>lark://</code>），以便从浏览器唤起自身。</p>
<p><strong>历史漏洞案例（思路要记住）：</strong><br>
自定义协议的参数处理逻辑，如果缺乏安全检查，可能存在注入漏洞。例如，允许通过协议参数传递 <code>file://</code> 路径，从而导致点击链接直接唤起客户端并执行本地文件。虽然主流应用已修复，但<strong>任何自定义协议的参数解析</strong>都是潜在的攻击面。</p>
<hr>
<h2 id="组合攻击案例与总结" class="toc-header"><a class="toc-anchor" href="#组合攻击案例与总结">¶</a> 组合攻击案例与总结</h2>
<h3 id="攻击思维训练从功能到漏洞" class="toc-header"><a class="toc-anchor" href="#攻击思维训练从功能到漏洞">¶</a> 攻击思维训练：从功能到漏洞</h3>
<p>拿到一个 IM 功能，按这个清单过一遍：</p>
<ul>
<li>这个功能的输入是什么？</li>
<li>输入怎么传递的？输出在哪里？</li>
<li>有没有特殊处理？（自动下载？协议唤起？）</li>
<li>权限边界在哪？（外部用户能访问吗？）</li>
</ul>
<h3 id="组合攻击案例" class="toc-header"><a class="toc-anchor" href="#组合攻击案例">¶</a> 组合攻击案例</h3>
<p><strong>目标</strong>：从外部协作群打到企业内网</p>
<ol>
<li><strong>侦察：</strong> 混入外部群，枚举成员信息，找到 IT 管理员邮箱。</li>
<li><strong>钓鱼：</strong> 伪造 OAuth 授权链接，窃取 IT 管理员的访问令牌。</li>
<li><strong>横向：</strong> 用管理员权限进入 IM 后台，利用**“批量消息”**功能，向全员发送恶意 LNK 文件 + 隐藏后门代码的 JPG 文件。</li>
<li><strong>提权：</strong> 植入后门成功，内网横向移动，控制域控服务器。</li>
</ol>
