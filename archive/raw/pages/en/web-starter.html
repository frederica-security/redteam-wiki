<p>在现代互联网场景下，越来越多的企业开始拥有自己的数字基础设施，用来代替他们那堆积如山的的纸质办公流程。这就意味着一家公司会有数以百计的各类Web系统（网站），用来支撑他们的日常工作，例如OA系统，工时系统，还有用于对外展示信息的门户网站，又或者是手机上的各类APP（它们往往也拥有Web后端）。<br>
这些系统中的大部分会位于内部网络，例如用于维护企业各种源代码的git平台，但其中也有一部分不得不对外开放的系统（例如，我想没有人会把自家企业官网设置成只有员工能访问吧）</p>
<hr>
<p>因此，一旦Web系统存在漏洞，攻击者可以接管Web服务器，并以此打开前往内部网络的突破口。</p>
<hr>
<p>来看一些例子（当然了，这里讲的都有所处理，并不完全是真实故事）：</p>
<ul>
<li>
<p>某地举办了一场攻防演练，其中一家单位疏于对Web资产的管理，导致有某些缺乏维护的古老资产被遗忘在在互联网的阴暗角落。最终这个Web页面被攻击方发现，其中存在Shiro550反序列化漏洞，导致攻击者可以远程在服务器上运行任意代码。攻击方的小伙伴并没有止步不前，而是进一步通过容器逃逸等技术接管了整个云，数以千计的云上服务器被全部接管。</p>
</li>
<li>
<p>一次攻防演练中，某家知名制造业公司虽然网站比较少，但是向用户提供了APP和小程序等移动端Web应用，最终攻击方经过逆向分析找到了其中泄露的AK/SK等重要凭证，随后进入云端资产，畅通无阻。</p>
</li>
<li>
<p>一次内部演习中，攻击方被禁止使用钓鱼方式来攻击，但是又被要求必须得到可观的战果。幸运的是在众多演练目标中存在一个偏僻的安防系统没有被及时更新版本，于是攻击方利用公开漏洞上传了jsp脚本，在服务器上执行了木马，并拿这个系统作为跳板，最终一路摸到了单位的监控摄像头中……</p>
</li>
</ul>
<h2 id="我们需要知道什么" class="toc-header"><a class="toc-anchor" href="#我们需要知道什么">¶</a> 我们需要知道什么</h2>
<p>从上面的案例我们能够知道，我们需要比管理员更了解他们的资产！因此信息收集是必不可少的，信息收集实际上会贯串我们在一次红队行动中的整个过程。如果还不能理解这一点，应当复习一下信息收集部分的内容。不过，Web信息收集实际上会引入对应专门的知识，我们接下来会提及。</p>
<p>错误：找到了xxx.com这个站点，于是对着主站一顿猛打，一无所获。</p>
<p>正确：在云端部署资产收集工具，通过被动信息侦查等方法，整理了一份包含目标单位几百个域名的表格，找出其中最薄弱的资产（旧系统/有公开漏洞/疏于维护/有遗留废弃账号等），最终一击必杀。</p>
<hr>
<p>在现实中的红队行动中，Web渗透虽然是获取突破口的最直接方式，但是随着现代网络安全防御体系的日趋完善，我们有时候会在Web上一无所获，因此也要做好应用其他手段的准备，了解钓鱼等技术是不可或缺的。</p>
