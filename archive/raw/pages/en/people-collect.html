<p>安全圈有一句名言：<strong>“你可以修补系统的漏洞，但你无法修补人性的漏洞。”</strong></p>
<p>当目标的服务器固若金汤，没有任何 Web 漏洞时，红队最常用的突破口就是<strong>社会工程学（Social Engineering）</strong>。<br>
简单的说：与其费劲破解管理员的密码，不如直接骗他把密码告诉你，或者让他亲手运行你的木马。</p>
<p><strong>人员测绘</strong>，就是为了寻找那个最容易上钩的“倒霉蛋”，并为他量身定做剧本。</p>
<hr>
<h2 id="h-2-基础画像收集联系方式" class="toc-header"><a class="toc-anchor" href="#h-2-基础画像收集联系方式">¶</a> 2. 基础画像：收集“联系方式” 📝</h2>
<p>这是最基本的素材。没有这些，你的木马就投递不出去。</p>
<ul>
<li><strong>邮箱规则 (Email Pattern):</strong>
<ul>
<li>你需要找出目标公司的邮箱命名规律。是 <code>zhangsan@target.com</code> 还是 <code>s.zhang@target.com</code>？</li>
<li><strong>技巧：</strong> 一旦掌握规律，配合一本“百家姓”字典，你就能生成目标公司几千名员工的邮箱列表。</li>
</ul>
</li>
<li><strong>手机号 (Mobile):</strong>
<ul>
<li>用于添加微信/whatsapp钓鱼或进行社工电话。</li>
<li><strong>来源：</strong> 很多时候，员工会把手机号留在名片、招标文档、甚至是官网的“联系我们”里。</li>
</ul>
</li>
</ul>
<hr>
<h2 id="h-3-进阶画像理解业务逻辑与人性弱点" class="toc-header"><a class="toc-anchor" href="#h-3-进阶画像理解业务逻辑与人性弱点">¶</a> 3. 进阶画像：理解“业务逻辑”与“人性弱点” 🧠</h2>
<p>收集到了联系方式直接发木马？<strong>错。</strong> 那样会被当成垃圾邮件。<br>
你需要理解这家公司是干什么的，利用他们的<strong>工作职责</strong>来攻击他们。</p>
<h3 id="场景一销售与商务-sales-is-the-best-entry" class="toc-header"><a class="toc-anchor" href="#场景一销售与商务-sales-is-the-best-entry">¶</a> 💼 场景一：销售与商务 (Sales is the best entry)</h3>
<ul>
<li><strong>心态分析：</strong> 销售不仅想谈生意，还怕错过大客户。他们<strong>必须</strong>打开客户发来的每一个文件。</li>
<li><strong>红队话术：</strong>
<blockquote>
<p>“您好，我是 XX 公司的采购，对咱们的产品很感兴趣。这是我们的采购需求清单（<code>需求清单.zip</code>），麻烦看一下能否满足？”</p>
</blockquote>
</li>
<li><strong>潜台词：</strong> 只要你的伪装足够像一个“金主爸爸”，销售人员会毫不犹豫地双击那个 ZIP 包里的 <code>.exe</code>。</li>
</ul>
<h3 id="场景二供应链与代理商审核" class="toc-header"><a class="toc-anchor" href="#场景二供应链与代理商审核">¶</a> 🤝 场景二：供应链与代理商审核</h3>
<ul>
<li><strong>心态分析：</strong> 很多公司有招募代理商或合作伙伴的流程，这通常涉及大量的文件传输（资质证明、营业执照）。</li>
<li><strong>红队操作：</strong>
<ul>
<li>假装申请成为代理商。</li>
<li>对方客服/审核员会说：“请把您的资质文件发给我。”</li>
<li><strong>机会来了：</strong> 你正大光明地把“木马”发给了内部人员，而且是<strong>对方主动要求的</strong>。</li>
</ul>
</li>
</ul>
<h3 id="场景三财务与银狐战术-the-silver-fox" class="toc-header"><a class="toc-anchor" href="#场景三财务与银狐战术-the-silver-fox">¶</a> 💰 场景三：财务与“银狐”战术 (The Silver Fox)</h3>
<ul>
<li><strong>心态分析：</strong> 谁不喜欢发钱？</li>
<li><strong>红队侦察：</strong> 调查该公司的福利情况、发薪日、或者常用的报销软件。</li>
<li><strong>红队话术（伪装成行政/HR）：</strong>
<blockquote>
<p>“@全体成员 接通知，本季度高温补贴/个税退税已发放，请查收附件并在今日内完成核对。”</p>
</blockquote>
</li>
<li><strong>目标：</strong> 这种攻击通常针对<strong>财务</strong>或<strong>HR</strong>，一旦拿下财务电脑，离公司的钱袋子就不远了。</li>
</ul>
<hr>
<h2 id="h-4-侧面画像hr-与招聘信息-️" class="toc-header"><a class="toc-anchor" href="#h-4-侧面画像hr-与招聘信息-️">¶</a> 4. 侧面画像：HR 与招聘信息 🕵️</h2>
<p>招聘网站（如 Boss直聘、拉勾、LinkedIn）是红队的情报金矿。</p>
<ul>
<li><strong>技术栈泄露：</strong>
<ul>
<li>如果 HR 在招 <strong>"深信服 VPN 运维工程师"</strong> —— 你知道目标用了什么 VPN。</li>
<li>如果 HR 在招 <strong>"泛微 OA 二次开发"</strong> —— 你知道目标用了什么 OA 系统（泛微 OA 历史上漏洞很多）。</li>
<li>如果 HR 在招 <strong>"Crowdstrike EPP 管理员"</strong> —— 警告！目标装了这款很难搞的 EDR，不要轻易丢普通木马。</li>
</ul>
</li>
<li><strong>职场氛围侦察 (LinkedIn / 脉脉):</strong>
<ul>
<li>寻找那些在职场 APP 上吐槽公司、抱怨工资低、甚至正在寻找下家的员工。</li>
<li><strong>利用：</strong> 给这类员工发送带有“高薪猎头职位”诱饵的木马，或者尝试收买他们提供内网凭证（虽然这通常属于黑产范畴，但红队需要了解这种风险）。</li>
</ul>
</li>
</ul>
<hr>
<h2 id="h-5-技术辅助爬虫与伪造-️" class="toc-header"><a class="toc-anchor" href="#h-5-技术辅助爬虫与伪造-️">¶</a> 5. 技术辅助：爬虫与伪造 🛠️</h2>
<p>除了靠嘴和脑子，我们还需要技术手段来提升效率和成功率。</p>
<h3 id="️-自动化爬虫-scraping" class="toc-header"><a class="toc-anchor" href="#️-自动化爬虫-scraping">¶</a> 🕸️ 自动化爬虫 (Scraping)</h3>
<ul>
<li><strong>原理：</strong> 写脚本自动爬取 LinkedIn、天眼查、企查查、或是目标官网的“团队介绍”页面。</li>
<li><strong>目的：</strong> 快速建立一份包含姓名、职位、照片的“花名册”。</li>
</ul>
<h3 id="身份伪造与-ps-deepfake-forgery" class="toc-header"><a class="toc-anchor" href="#身份伪造与-ps-deepfake-forgery">¶</a> 🎭 身份伪造与 PS (Deepfake &amp; Forgery)</h3>
<ul>
<li><strong>PS 工卡/证件：</strong>
<ul>
<li>有些企业的内部 APP（如钉钉、飞书的某些自建应用）或门禁系统，在找回密码或初次认证时，需要上传“手持工卡照”或“身份证人像面”。</li>
<li>红队利用 PS 技术，结合爬虫获取的员工照片，伪造一张工卡照片，可能就能通过审核，接管该员工的数字身份。</li>
</ul>
</li>
<li><strong>人脸识别对抗（了解即可）：</strong>
<ul>
<li>利用 AI 换脸或照片活化技术（让静态照片眨眼、点头），试图绕过 APP 的人脸识别验证。这在攻击金融类业务或高等级内网入口时会用到。</li>
</ul>
</li>
</ul>
<hr>
<h2 id="h-6-总结你在凝视深渊" class="toc-header"><a class="toc-anchor" href="#h-6-总结你在凝视深渊">¶</a> 6. 总结：你在凝视深渊</h2>
<p>做人员测绘时，你不仅是在看数据，你是在看一个公司的<strong>组织架构</strong>、<strong>业务流程</strong>和<strong>人心向背</strong>。</p>
<ul>
<li><strong>新手看数据：</strong> 搞到了 100 个手机号，我挨个打电话加微信发木马。</li>
<li><strong>老手看故事：</strong> 发现这家公司最近在扩招代理商，财务部最近在用钉钉发报销，且技术部正在招聘反病毒工程师。</li>
</ul>
<p>于是老手制定了一个假装申请代理商，通过微信发给销售部一个<strong>营业执照.pdf.lnk</strong>诱饵的计划，很可能还和销售聊了好几天的大生意，把对方忽悠得神魂颠倒。</p>
