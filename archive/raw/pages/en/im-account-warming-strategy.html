<p>在上一章中，我们强调了 IM 消息相比邮件的巨大优势：<strong>信任感高</strong>、<strong>易于挥发</strong>（撤回后难以取证）以及<strong>客户端攻击面广</strong>。</p>
<p>然而，所有这些优势都依赖于一个前提：<strong>你的 IM 账号能够存活</strong>。</p>
<p>用于侦察、钓鱼和渗透的账号本质上是<strong>消耗品</strong>。每一次成功的钓鱼，都伴随着极高的被举报风险。尤其当你利用像微信这样的平台时，你正在挑战一套基于社交图谱、行为分析和大数据风控的复杂系统。</p>
<p>一旦你的账号被目标用户举报或触发平台风控：</p>
<ol>
<li><strong>行动中断：</strong> 账号立即被封禁，消息无法发送，你精心设计的攻击链条（OAuth 链接或 LNK 文件）瞬间失效。</li>
<li><strong>横向打击：</strong> 平台会启动<strong>横向检测机制</strong>，扫描同 IP、同设备、同 WIFI 下的其他账号，导致你的整个账号池资源崩溃。</li>
</ol>
<p>因此，红队的策略必须是一场<strong>储备消耗战</strong>——你需要持续、稳定地投入资源，通过<strong>养号</strong>来提高账号的<strong>权重分</strong>，以确保在战斗中能经受住举报，维持高自由度的操作空间。</p>
<hr>
<h2 id="微信风控账号权重决定命运" class="toc-header"><a class="toc-anchor" href="#微信风控账号权重决定命运">¶</a> 微信风控：账号“权重”决定命运</h2>
<p>微信的本质是一套<strong>账号评分体系</strong>。一个高权重的账号，即使进行与低权重账号相同的“钓鱼”操作，也可能安然无事。这是因为腾讯会将有限的监控资源优先倾斜给<strong>低权重、高风险</strong>的账号。</p>
<h3 id="核心指标你不能碰的数字红线" class="toc-header"><a class="toc-anchor" href="#核心指标你不能碰的数字红线">¶</a> 核心指标：你不能碰的数字红线</h3>
<p>这些数字是普遍安全值，一旦触碰很容易立即触发风控。</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">限制类型</th>
<th style="text-align:left">限制数值</th>
<th style="text-align:left">风险说明</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>主动添加好友</strong></td>
<td style="text-align:left">每天 ≤ 50 人；每 10 小时 ≤ 15 人</td>
<td style="text-align:left">超出阀值，你发送的钓鱼请求对方无法收到，并有封号风险。</td>
</tr>
<tr>
<td style="text-align:left"><strong>被动添加好友</strong></td>
<td style="text-align:left">每天 ≤ 200 人</td>
<td style="text-align:left"><strong>钓鱼初期</strong>，被动添加是安全拉客的方式。</td>
</tr>
<tr>
<td style="text-align:left"><strong>建群/进群</strong></td>
<td style="text-align:left">每天进群 ≤ 10 个；群人数超 100 需实名验证。</td>
<td style="text-align:left">批量进群是账号异常活跃的重要特征。</td>
</tr>
<tr>
<td style="text-align:left"><strong>好友上限</strong></td>
<td style="text-align:left">总上限约 5000+ 人</td>
<td style="text-align:left"><strong>注意：</strong> 好友数超过 4000 人反而会降低权重分。</td>
</tr>
</tbody>
</table></div>
<blockquote>
<p><strong>关键思路：</strong> 风控的判断不仅看 <strong>“全天指标”</strong>，更看 <strong>“单位时间指标”</strong>。一次性加 20 人立即封号，分摊到每小时加 5 人，则可能安全达标。</p>
</blockquote>
<h3 id="权重加分规则模拟真实用户" class="toc-header"><a class="toc-anchor" href="#权重加分规则模拟真实用户">¶</a> 权重加分规则：模拟真实用户</h3>
<p>你的养号策略，就是模拟一个<strong>重度、多元化、高质量</strong>的真实用户。</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">行为类别</th>
<th style="text-align:left">操作目的与价值</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>基础信息</strong></td>
<td style="text-align:left"><strong>完整性满分</strong>：绑定手机号、银行卡、QQ、邮箱，完成实名认证。</td>
</tr>
<tr>
<td style="text-align:left"><strong>使用时长</strong></td>
<td style="text-align:left"><strong>注册时间越长，权重越高</strong>。这是最难用技术弥补的指标。</td>
</tr>
<tr>
<td style="text-align:left"><strong>聊天互动</strong></td>
<td style="text-align:left">图文、语音、视频等<strong>互动方式多样</strong>，与多个好友维持稳定、<strong>双向</strong>的聊天频率。</td>
</tr>
<tr>
<td style="text-align:left"><strong>内容生态</strong></td>
<td style="text-align:left">经常发朋友圈，与好友有点赞和评论互动；阅读腾讯新闻、订阅和阅读公众号。</td>
</tr>
<tr>
<td style="text-align:left"><strong>金融行为</strong></td>
<td style="text-align:left">经常使用微信支付、发/抢红包、购买理财产品、充值话费。<strong>这是证明账号价值最高的行为。</strong></td>
</tr>
</tbody>
</table></div>
<h3 id="权重扣分规则避免程序行为" class="toc-header"><a class="toc-anchor" href="#权重扣分规则避免程序行为">¶</a> 权重扣分规则：避免“程序行为”</h3>
<p>所有<strong>中间没有其他操作、单一行为频繁重复</strong>的动作，都会被判定为机器操作，导致扣分。</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">扣分风险点</th>
<th style="text-align:left">描述</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>环境异常</strong></td>
<td style="text-align:left">使用黑名单 IP；同一 WiFi 下大量账号进行相同操作；IP 或定位发生突变。</td>
</tr>
<tr>
<td style="text-align:left"><strong>行为异常</strong></td>
<td style="text-align:left">个人信息改动过于频繁；新加好友不互动，且被删除比例过高。</td>
</tr>
<tr>
<td style="text-align:left"><strong>单一高频</strong></td>
<td style="text-align:left">短时间发 10 条以上朋友圈；频繁刷新“附近的人”或摇一摇（高风险功能）。</td>
</tr>
<tr>
<td style="text-align:left"><strong>违规内容</strong></td>
<td style="text-align:left">发送包含欺诈、色情、政治、金融敏感词汇（如发票、期货、支付宝、银行账号）的信息。</td>
</tr>
</tbody>
</table></div>
<hr>
<h2 id="账号注册与存活基地的建立" class="toc-header"><a class="toc-anchor" href="#账号注册与存活基地的建立">¶</a> 账号注册与存活：基地的建立</h2>
<p>新号的存活周期是所有策略的基石。在注册阶段，平台会进行最严格的设备和环境检测。</p>
<h3 id="注册的原则环境控制" class="toc-header"><a class="toc-anchor" href="#注册的原则环境控制">¶</a> 注册的原则（环境控制）</h3>
<ol>
<li><strong>设备限制：</strong> 一台手机<strong>一个月注册次数 &lt; 5 次</strong>，一天 &lt; 2 次。</li>
<li><strong>IP 切换：</strong> 注册时必须使用<strong>手机流量卡</strong>，在第二次注册前，必须启动<strong>两次飞行模式</strong>（强制切换 IP）。</li>
<li><strong>环境固化：</strong> 注册完成后<strong>不能立即切换手机登陆</strong>，尽量在原手机保持 <strong>7 天</strong>以上。</li>
<li><strong>批量规避：</strong> 即使购买账号，也要选择<strong>传统号段 (13x)</strong>，且手机号码<strong>不要挨着</strong>。</li>
<li><strong>安卓优先：</strong> <strong>安卓系统</strong>注册的账号，因其系统权限和可收集的信息更多，权重通常高于苹果系统。</li>
</ol>
<hr>
<h2 id="极简养号术打造老号的日常" class="toc-header"><a class="toc-anchor" href="#极简养号术打造老号的日常">¶</a> 极简养号术：打造“老号”的日常</h2>
<p>养号有两个目的：<strong>提高权重防封</strong>，以及<strong>铺垫朋友圈提高信任度</strong>（为你的<strong>钓鱼话术</strong>提供背景支撑）。</p>
<h3 id="新号上线首周核心操作高风险期" class="toc-header"><a class="toc-anchor" href="#新号上线首周核心操作高风险期">¶</a> 新号上线：首周核心操作（高风险期）</h3>
<p>这是新号适应环境、获得信任的阶段，必须谨慎。</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">时间</th>
<th style="text-align:left">操作重点</th>
<th style="text-align:left">注意事项</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>第一天</strong></td>
<td style="text-align:left">互加 3-5 个老号；老号给新号备注/标签；互聊 5-10 句话。</td>
<td style="text-align:left"><strong>不要立即修改全套资料！</strong> 让账号适应环境。</td>
</tr>
<tr>
<td style="text-align:left"><strong>次日</strong></td>
<td style="text-align:left">设置微信号（不能有规律）；模拟对话；发一条朋友圈。</td>
<td style="text-align:left">资料修改不要批量、不要有规律，且要错开时间。</td>
</tr>
<tr>
<td style="text-align:left"><strong>持续 7 天</strong></td>
<td style="text-align:left"><strong>保持手机流量</strong>；打开定位（模拟移动轨迹）；每天至少发送一次朋友圈。</td>
<td style="text-align:left">资料设置好后一段时间内不要频繁修改。</td>
</tr>
</tbody>
</table></div>
<h3 id="高权重日常维护多元互动" class="toc-header"><a class="toc-anchor" href="#高权重日常维护多元互动">¶</a> 高权重日常维护：多元互动</h3>
<p>目标是<strong>多元化、日常化</strong>的使用，避免任何单一的高频动作。</p>
<ol>
<li><strong>聊天互动：</strong>
<ul>
<li>与 3-5 个好友聊天，每天分三个时间段，每次 5-10 句<strong>双向</strong>对话（文字、语音、图片等多样内容）。</li>
<li><strong>战术价值：</strong> 确保账号权重，以便后续发送 OAuth 链接或 LNK 文件时不被立即拦截。</li>
</ul>
</li>
<li><strong>内容生态：</strong>
<ul>
<li>模拟阅读腾讯新闻、订阅公众号，并<strong>分享到朋友圈</strong>，用其他号点赞评论。</li>
<li><strong>战术价值：</strong> 打造一个有血有肉的社交形象，为你的<strong>钓鱼话术</strong>提供可信背景。</li>
<li>多刷视频号：这是微信的重点主推新功能，能显著的增加你的账号权重。</li>
</ul>
</li>
<li><strong>金融与发现：</strong>
<ul>
<li>发 1 个红包给老号，收 1 个红包。</li>
<li>模拟使用游戏、购物等功能。</li>
<li><strong>战术价值：</strong> 增加账号的金融权重，提高在风控系统中的地位。</li>
</ul>
</li>
</ol>
<hr>
<h2 id="终极防御平台的监控规则知己知彼" class="toc-header"><a class="toc-anchor" href="#终极防御平台的监控规则知己知彼">¶</a> 终极防御：平台的监控规则（知己知彼）</h2>
<p>了解微信的三大监控规则，才能理解你的每一次操作都在被如何评估，从而规避<strong>程序化行为</strong>。</p>
<ol>
<li>
<p><strong>监控等级规则 (Level Monitoring)：</strong></p>
<ul>
<li>不同权重的账号对应不同的监控强度。资源有限，优先监控低权重账号。</li>
</ul>
</li>
<li>
<p><strong>横向检测规则 (Horizontal Detection)：</strong></p>
<ul>
<li>当你的一个账号因钓鱼行为被判断异常后，腾讯会立即扫描<strong>同 IP、同定位</strong>下的其他账号是否有同样的异常，<strong>同环境的账号会被牵连</strong>。</li>
</ul>
</li>
<li>
<p><strong>属性监控规则 (Attribute Monitoring)：</strong></p>
<ul>
<li>根据账号的性别、地区等属性进行功能限制。例如，某些功能只对特定属性的账号开放。</li>
</ul>
</li>
</ol>
<p><strong>总结：</strong> 储备消耗战是一场对细节、耐心和环境控制的考验。你的目标是将你的“料号”培养成一个拥有最高自由度、足以承受几次用户举报的“惯犯”，以保障你在 IM 攻防链中的资源稳定。</p>
