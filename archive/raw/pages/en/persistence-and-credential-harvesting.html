<p>想象一下，红队行动就像是一场精心策划的“攻占金库”行动。我们之前学习的每一个技术步骤，都是我们在金库里执行的不同任务，它们有着明确的先后顺序和目的：</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">步骤（技术术语）</th>
<th style="text-align:left">目标（金库行动）</th>
<th style="text-align:left">核心目的</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Bypass UAC</strong></td>
<td style="text-align:left"><strong>解除门禁限制</strong></td>
<td style="text-align:left">让您这位管理员能使用<strong>自己的最高权限钥匙</strong>。</td>
</tr>
<tr>
<td style="text-align:left"><strong>本地权限提升 (LPE)</strong></td>
<td style="text-align:left"><strong>窃取看守者的钥匙</strong></td>
<td style="text-align:left">从一个普通人（User）<strong>逆袭</strong>成为金库的最高管理者（SYSTEM）。</td>
</tr>
<tr>
<td style="text-align:left"><strong>持久化 (Persistence)</strong></td>
<td style="text-align:left"><strong>安装秘密入口/备用钥匙</strong></td>
<td style="text-align:left">确保你被赶出去后，<strong>随时可以再次潜入</strong>，掌控长期访问权。</td>
</tr>
<tr>
<td style="text-align:left"><strong>凭据窃取 (Credential Theft)</strong></td>
<td style="text-align:left"><strong>清点战利品</strong></td>
<td style="text-align:left">获取系统中所有<strong>有价值的纸条和密码本</strong>，为下一步行动做准备。</td>
</tr>
</tbody>
</table></div>

<h3 id="h-1-从普通游客到金库管理员的转变" class="toc-header"><a class="toc-anchor" href="#h-1-从普通游客到金库管理员的转变">¶</a> 1. 从“普通游客”到“金库管理员”的转变</h3>
<p>当您第一次成功攻入一台电脑（比如，通过一个钓鱼邮件或一个网站漏洞）时，您的身份通常只是一个<strong>普通游客</strong>（低权限用户）。</p>
<p>但要想真正做点什么，您需要更高的权限。这就是前两个步骤的目的：</p>
<ul>
<li><strong>⚡️ 启动加速器 (Bypass UAC)：</strong> 如果目标机器的用户本身就是管理员，但他被<strong>UAC锁在标准令牌</strong>里。我们做的就是解除这个限制，让他能够用回自己完整的管理员权力。这就像一个警察，他原本就有枪，我们只是帮他解除了枪套的保险。</li>
<li><strong>👑 抢夺最高权力 (LPE)：</strong> 如果目标机器用户只是一个普通员工，权限很低。我们就需要利用操作系统的漏洞，<strong>直接窃取</strong>系统最高权力 <code>SYSTEM</code>。这就像一个普通人，通过一套精妙的逻辑和工具，最终偷到了金库最高管理者的钥匙和身份。</li>
</ul>
<p><strong>到这一步，您已经站在了系统的权力之巅。</strong></p>
<h3 id="h-2-留下印记确保你赶不走" class="toc-header"><a class="toc-anchor" href="#h-2-留下印记确保你赶不走">¶</a> 2. 留下印记：确保你“赶不走”</h3>
<p>权限是短暂的。如果目标机器重启了，或者被管理员发现了您的程序并关闭了，您将<strong>一无所有</strong>。</p>
<ul>
<li><strong>🚪 安装秘密入口 (持久化)：</strong> 正如您刚才所见，持久化就是在系统<strong>合法、且隐蔽</strong>的自启动机制里，偷偷写下我们程序的启动命令。
<ul>
<li>它可以是<strong>注册表</strong>里的一行小字。</li>
<li>它可以是<strong>计划任务</strong>里的一个定时提醒。</li>
<li>它可以是<strong>系统服务</strong>里的一个不起眼的改动。</li>
</ul>
</li>
</ul>
<p>我们的目标是：<br>
让系统把我们的恶意程序<strong>误认为</strong>是它自己需要启动的一部分。这样，无论系统重启多少次，我们都能<strong>自动回到</strong>最高权限状态，成为系统里<strong>赶不走的客人</strong>。</p>
<h3 id="h-3-清点战利品最重要的财富" class="toc-header"><a class="toc-anchor" href="#h-3-清点战利品最重要的财富">¶</a> 3. 清点战利品：最重要的财富</h3>
<p>现在您已经拥有最高权限，并且建立了稳定的秘密通道。下一步是什么？当然是<strong>搜集最有价值的战利品——凭据 (Credentials)</strong>。</p>
<blockquote>
<p><strong>凭据就是密码、密钥、令牌和身份证明。它们比文件本身更有价值！</strong></p>
</blockquote>
<ul>
<li><strong>🔑 Mimikatz：</strong> 这是一款著名的<strong>令牌收割机</strong>。它可以从 Windows 内存（<code>lsass.exe</code> 进程）中，<strong>直接抓取</strong>当前登录用户、以及过去登录过的用户的：<strong>明文密码</strong>、<strong>哈希值</strong> 和 <strong>身份验证令牌 (Token)</strong>。拿到这些，就等于拿到了这些用户的“通行证”。</li>
<li><strong>🍪 浏览器密码和 Cookies：</strong> 用户最不设防的地方。我们会寻找浏览器（Chrome, Edge, Firefox等）的存储文件，解密其中保存的<strong>网站密码</strong>和<strong>Session Cookies</strong>。拿到 Cookies，您可以直接以该用户的身份登录邮箱、社交媒体、甚至公司内部系统，无需密码。</li>
<li><strong>🏰 域凭据：</strong> 如果这台电脑是公司网络（<strong>域 (Domain) 环境</strong>）的一部分，我们窃取的凭据可能就是<strong>横向移动</strong>到其他服务器或整个网络的关键。</li>
</ul>
<hr>
<p><strong>总结：</strong></p>
<p>这一系列章节将带您完成一次完整的“数字金库之旅”：从<strong>获取最高权限（UAC/LPE）</strong>，到<strong>确保长期驻留（持久化）</strong>，最终到<strong>收割最有价值的财富（凭据窃取）</strong>。</p>
