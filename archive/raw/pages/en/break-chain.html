但是，在现代端点防护（EDR）和反作弊系统（AC）的严密监控下，传统的进程注入技术早已举步维艰。提到 <code>SetWindowsHookEx</code>，许多安全开发者的第一反应是“老掉牙”、“见光死”。</p>
<p>然而，近期由高级威胁组织（如 Storm-0978）和外挂开发者（Waryas）复现并开源在UC论坛 <a href="https://www.unknowncheats.me/forum/anti-cheat-bypass/727001-usermode-bypass-framework.html" class="is-external-link">https://www.unknowncheats.me/forum/anti-cheat-bypass/727001-usermode-bypass-framework.html</a>  的现代版“破碎注入（Shatter Attack）”，改变了这个认知。</p>
<p>由于我们主要关注断开进程链的技术，本文将介绍Waryas公开的<strong>无高危进程句柄（Handle-less）、无模块加载（DLLless）、且能绕过用户态 CFG（控制流卫士)</strong> 的技术。</p>
<p>注：实际测试中对explorer / edge 等开启了CFG的窗体进程均能做到成功注入并切断进程链，Waryas的结论正确，部分文章存在微小的偏差。</p>
<hr>
<h2 id="一-setwindowshookex-的前世今生" class="toc-header"><a class="toc-anchor" href="#一-setwindowshookex-的前世今生">¶</a> 一、 SetWindowsHookEx 的前世今生</h2>
<p>要理解这项技术，必须厘清它与传统窗体Hook注入的区别。</p>
<h3 id="传统手法已被淘汰的直球攻击" class="toc-header"><a class="toc-anchor" href="#传统手法已被淘汰的直球攻击">¶</a> 传统手法（已被淘汰的“直球攻击”）</h3>
<ul>
<li><strong>原理</strong>：攻击者调用 <code>SetWindowsHookEx</code>，传入一个位于硬盘上的恶意 DLL（如 <code>Hack.dll</code>）路径。操作系统底层的 Loader 会被强制唤醒，将该 DLL 注入（<code>LoadLibrary</code>）到目标进程的内存空间中。</li>
<li><strong>致命弱点</strong>：会在目标进程的用户态 PEB（进程环境块）模块链表中留下明显的加载记录；同时，其分配的内存也会在内核态的 VAD 树（虚拟地址描述符）中留下特征异常。EDR 和反作弊的微过滤驱动拦截或扫描这种双重维度的痕迹如同探囊取物。</li>
</ul>
<h3 id="现代破碎注入无模块-doprop" class="toc-header"><a class="toc-anchor" href="#现代破碎注入无模块-doprop">¶</a> 现代破碎注入（无模块 DOP/ROP）</h3>
<ul>
<li><strong>原理</strong>：<strong>不再加载任何外部 DLL</strong>。它将 <code>SetWindowsHookEx</code> 仅仅作为一个<strong>合法的执行触发器</strong>。</li>
<li><strong>无句柄</strong>：传统注入需要申请 <code>PROCESS_VM_WRITE</code> 或 <code>PROCESS_CREATE_THREAD</code> 等极度敏感的高危句柄。而该技术仅需极低权限的 <code>PROCESS_QUERY_LIMITED_INFORMATION</code> 来获取基础信息，后续所有真实的“读写执行”动作，<strong>全部依赖目标窗口句柄（HWND）和系统合法的窗口消息机制（Message Queue）完成</strong>。这使得绝大部分依赖进程句柄监控的防护手段直接失效。</li>
</ul>
<hr>
<h2 id="二-核心利用细节共享内存与-gadget-链的配合" class="toc-header"><a class="toc-anchor" href="#二-核心利用细节共享内存与-gadget-链的配合">¶</a> 二、 核心利用细节：共享内存与 Gadget 链的配合</h2>
<p>既然不加载恶意 DLL，攻击者如何将控制指令传递给目标进程？答案是<strong>跨进程共享内存（Shared Memory）与数据导向编程（DOP）</strong>。</p>
<h3 id="h-1-数据的桥梁寻找天然共享内存" class="toc-header"><a class="toc-anchor" href="#h-1-数据的桥梁寻找天然共享内存">¶</a> 1. 数据的桥梁：寻找天然共享内存</h3>
<p>在 Waryas 的源码中，攻击者并没有使用敏感的 <code>VirtualAllocEx</code>，而是通过遍历目标进程的内存映射，寻找天然存在的共享内存区块（例如 <code>SHCore.dll</code> 映射的数据段，或利用 <code>RtlGetIntegerAtom</code> 强行分配的原子表空间）。<br>
这块共享内存成为了“控制信道”。攻击者在其中布置了一个包含执行参数的结构体（<code>wparam</code>）：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-cpp">struct wparam {
    uint64_t target_function; // 最终要调用的函数，如 RtlCopyString 或 malloc
    uint64_t arg1;            // 参数1 (RCX)
    uint64_t arg2;            // 参数2 (RDX)
    uint64_t trampoline_ptr;  // 跳板函数地址
    // ... 其他用于存放读写数据的缓冲区 ...
};

</code></pre>
<h3 id="h-2-精准引爆gategadget-链的配合" class="toc-header"><a class="toc-anchor" href="#h-2-精准引爆gategadget-链的配合">¶</a> 2. 精准引爆：Gate/Gadget 链的配合</h3>
<p>攻击者在目标进程自带的 <code>ntdll.dll</code> 和 <code>shell32.dll</code> 中寻找特定的合法汇编片段（源码中的 <code>w</code> 和 <code>t</code>）：</p>
<ol>
<li><strong>下达触发器</strong>：利用 <code>SetWindowsHookEx(WH_SHELL, w, ...)</code> 下钩子，将回调直接指向系统合法 Gadget <code>w</code>。</li>
<li><strong>消息传参</strong>：向目标窗口发送 <code>WM_APPCOMMAND</code> 消息，并将共享内存的地址作为参数传递：<br>
<code>SendMessageA(HWND, WM_APPCOMMAND, SharedMemoryAddress, ...);</code></li>
<li><strong>控制流劫持</strong>：目标进程处理消息 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mo>→</mo></mrow>\rightarrow</math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.36687em;vertical-align:0em;"></span><span class="mrel">→</span></span></span></span> 触发 Gadget <code>w</code> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mo>→</mo></mrow>\rightarrow</math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.36687em;vertical-align:0em;"></span><span class="mrel">→</span></span></span></span> <code>w</code> 读取共享内存中的 <code>wparam</code> 结构体 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mo>→</mo></mrow>\rightarrow</math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.36687em;vertical-align:0em;"></span><span class="mrel">→</span></span></span></span> 跳转到跳板 Gadget <code>t</code> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mo>→</mo></mrow>\rightarrow</math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.36687em;vertical-align:0em;"></span><span class="mrel">→</span></span></span></span> <code>t</code> 将共享内存中的参数反序列化到对应的寄存器（RCX, RDX 等）<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mo>→</mo></mrow>\rightarrow</math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.36687em;vertical-align:0em;"></span><span class="mrel">→</span></span></span></span> 执行最终的函数调用（如 <code>RtlCopyString</code>）。</li>
</ol>
<p><strong>关于 CFG 的绕过</strong>：由于挑选的这些跳板函数（如 <code>RtlpFcChangeRegistrationCallback</code> 或特定汇编块）本身就是系统合法的间接调用目标，且拥有标准的 <code>.pdata</code> 异常处理记录，因此系统的 CFG 校验会将其视为“安全目标”直接放行。</p>
<p><img src="/explorer.png" alt="explorer.png"></p>
<p>explorer.exe开启了CFG，但通过该攻击方法可以成功注入。</p>
<hr>
<h2 id="三-演变与进化windows-11-24h2-的合法后门-fixup" class="toc-header"><a class="toc-anchor" href="#三-演变与进化windows-11-24h2-的合法后门-fixup">¶</a> 三、 演变与进化：Windows 11 24H2 的“合法后门” (Fixup)</h2>
<p>随着 Windows 安全机制的不断收紧，系统内核对 <code>SetWindowsHookEx</code> 引入了<strong>严格的模块验证（Module Validation）</strong>：即声明的钩子模块（如代码中传入的 <code>uxtheme.dll</code>）必须与实际的函数地址范围一致。这本该让跨模块调用 <code>ntdll</code> Gadget 的行为被内核无情拒绝。</p>
<p>然而，Windows 11 24H2 (Build 26100) 为了兼容 Prism 模拟器（Emulator），在底层撕开了一个受控的“口子”。作者极其精妙地利用了这一机制：</p>
<ol>
<li><strong>定位弱点</strong>：计算出目标线程的 <code>TEB + 0x1850</code> 偏移，这是系统新增的“跨进程模拟”状态标志位。</li>
<li><strong>第一级火箭（临时越狱）</strong>：下发一个临时的合法钩子，指向未公开系统函数 <code>RtlOpenCrossProcessEmulatorWorkConnection</code>。通过消息触发该函数后，其内部逻辑会“合法地”将 <code>TEB + 0x1850</code> 的标志位置位，强行开启模拟器特权。</li>
<li><strong>第二级火箭（真实注入）</strong>：特权开启后，内核的模块验证机制被临时豁免。此时再执行真实的 Gadget 钩子，系统将不再拦截。这是一种极其高级的<strong>逻辑状态滥用（Logic Abuse）</strong>。</li>
</ol>
<hr>
<h2 id="四-局限性与实战意义" class="toc-header"><a class="toc-anchor" href="#四-局限性与实战意义">¶</a> 四、 局限性与实战意义</h2>
<p>正如在实际测试中所发现的，这项技术并非无所不能，它有着极其明确的边界：</p>
<ol>
<li><strong>受限的代码执行能力</strong>：由于其完全依赖 Gadget 链对寄存器的编排，它<strong>目前只能完美调用参数较少、结构简单的系统函数</strong>（如 <code>WinExec</code>）。</li>
<li><strong>无法直接执行复杂 Shellcode</strong>：攻击者无法将一段数百字节的复杂 Shellcode 塞入消息队列让其直接运行。</li>
<li><strong>实战中的真正用途</strong>：虽然不能直接跑 Shellcode，但它足以完成<strong>断链隐藏</strong>功能。</li>
</ol>
<hr>
<h2 id="五-参数博弈与上下文之争in-proc-与-out-of-proc-的边界重构" class="toc-header"><a class="toc-anchor" href="#五-参数博弈与上下文之争in-proc-与-out-of-proc-的边界重构">¶</a> 五、 参数博弈与上下文之争：In-proc 与 Out-of-proc 的边界重构</h2>
<p>先来看一张完整示意图（攻击者通过黑进程注入edge.exe调用winexec断链）</p>
<p><img src="/shatter.png" alt="shatter.png"></p>
<p>要理解代码层面的创新，我们需要直击 SetWindowsHookEx API 的四个关键参数：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">HHOOK SetWindowsHookExA(int idHook, HOOKPROC lpfn, HINSTANCE hMod, DWORD dwThreadId);
</code></pre>
<p>在传统注入与现代破碎注入中，攻击者对这四个参数的构造逻辑有着天壤之别。这里就涉及到了 Windows 钩子的核心概念：上下文内（In-proc）与上下文外（Out-of-proc）。</p>
<ol>
<li>传统 DLL 注入的参数（强制的 In-proc 渗透）</li>
</ol>
<p>在传统的 DLL 注入中，攻击者的调用方式通常如下：</p>
<p>lpfn (钩子函数)：指向攻击者自己编写的恶意 DLL 中的导出函数。</p>
<p>hMod (模块句柄)：恶意 DLL 在攻击者进程中的模块句柄。</p>
<p>上下文机制：这是标准的 In-proc（进程内） 模式。为了让目标窗口处理消息时能执行到 lpfn，Windows 内核（Loader）别无选择，只能强行把 hMod 对应的恶意 DLL 加载（LoadLibrary）到目标进程的内存空间中。这就是为什么传统方法必带模块落地，极易被 EDR 查杀的原因。</p>
<ol start="2">
<li>现代破碎注入的参数（Out-of-proc 控制，In-proc 执行）</li>
</ol>
<p>现代手法的参数构造堪称“借鸡生蛋”：</p>
<p>lpfn (钩子函数)：传入的不再是恶意函数，而是目标进程 ntdll.dll 或 shell32.dll 中系统自带的合法汇编片段（Gadget 的地址，如代码中的 w）。</p>
<p>hMod (模块句柄)：传入的是系统合法的模块句柄（如代码中加载的 uxtheme.dll）。</p>
<p>上下文机制的颠覆：</p>
<p>通常，像 WH_KEYBOARD_LL 这样的低级钩子是 Out-of-proc（进程外） 的，回调在攻击者进程执行，安全但不具备直接控制目标进程内存的能力。</p>
<p>现代破碎注入依然使用的是 In-proc（进程内） 钩子（如 WH_SHELL），但它骗过了系统！因为它传入的 hMod 是一个目标进程早已加载的合法系统 DLL，lpfn 也是目标进程内已有的合法地址。</p>
<p>因此，Windows 内核认为：“哦，这个 DLL 目标进程里已经有了，不需要加载新模块，直接回调吧。”</p>
<p>总结这一精妙差异：</p>
<p>传统注入是“把木马塞进去运行”（传统的 In-proc）；而现代手法实现了 <strong>控制流的 Out-of-proc（通过共享内存和消息发送参数）</strong> ，而执行流使用了 <strong>In-proc（借用系统自带的 Gadget 拼接执行）</strong> 。 它完美剥离了恶意代码载体与执行上下文的绑定，使得 EDR 无法通过监控模块加载（Image Load Callback）来抓取注入行为。</p>
<h3 id="结语" class="toc-header"><a class="toc-anchor" href="#结语">¶</a> 结语</h3>
<p>现代“破碎注入”剥离了粗糙的 DLL 加载，化身为了精密的“ROP 消息数据流”。虽然在具备完整win32k数据源采集 / InfinityHook能力的edr面前仍然会显形（ndrservercall），但足够穿透很多杀软的进程链检查。</p>
