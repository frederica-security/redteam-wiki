e slot="contents"><div><h2 id="模块一底层开发与恶意代码-核心" class="toc-header"><a class="toc-anchor" href="#模块一底层开发与恶意代码-核心">¶</a> 💻 模块一：底层开发与恶意代码 (核心)</h2>
<p>本模块词汇主要围绕 Shellcode、Loader 以及相关编程语言。</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">中文术语</th>
<th style="text-align:left">英文术语</th>
<th style="text-align:left">定义与作用</th>
<th style="text-align:left">在攻防中的用途</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>外壳代码</strong></td>
<td style="text-align:left">Shellcode</td>
<td style="text-align:left">一串纯粹的机器指令，是让 CPU 执行特定任务的核心代码。</td>
<td style="text-align:left">你的“<strong>子弹</strong>”，负责反弹 Shell 或建立 C2 连接。</td>
</tr>
<tr>
<td style="text-align:left"><strong>加载器</strong></td>
<td style="text-align:left">Loader</td>
<td style="text-align:left">你编写的程序，负责将 Shellcode 放入内存并启动执行。</td>
<td style="text-align:left">你的“<strong>枪</strong>”，用于绕过杀软执行 Shellcode。</td>
</tr>
<tr>
<td style="text-align:left"><strong>C++</strong></td>
<td style="text-align:left">C++</td>
<td style="text-align:left">一种性能极高、可直接操作内存的编程语言。</td>
<td style="text-align:left"><strong>核心语言。</strong> 用于编写 Loaders、Implant 等底层恶意代码。</td>
</tr>
<tr>
<td style="text-align:left"><strong>Python</strong></td>
<td style="text-align:left">Python</td>
<td style="text-align:left">一种高级脚本语言，开发效率高，语法简洁。</td>
<td style="text-align:left"><strong>辅助语言。</strong> 用于编写 C2 服务器、快速扫描脚本或数据处理。</td>
</tr>
<tr>
<td style="text-align:left"><strong>Visual Studio</strong></td>
<td style="text-align:left">VS</td>
<td style="text-align:left">微软提供的集成开发环境。</td>
<td style="text-align:left">编译和调试 Loaders 等 C/C++ 项目的主要工具。</td>
</tr>
<tr>
<td style="text-align:left"><strong>机器码</strong></td>
<td style="text-align:left">Machine Code</td>
<td style="text-align:left">CPU 能直接理解和执行的二进制指令。</td>
<td style="text-align:left">Shellcode 的原始形式。</td>
</tr>
<tr>
<td style="text-align:left"><strong>免杀</strong></td>
<td style="text-align:left">Evasion</td>
<td style="text-align:left">使恶意程序不被杀毒软件或安全产品检测到的技术。</td>
<td style="text-align:left">攻击者必须绕过的主要防御。</td>
</tr>
<tr>
<td style="text-align:left"><strong>混淆</strong></td>
<td style="text-align:left">Obfuscation</td>
<td style="text-align:left">通过加密、变形、打乱代码等方式，隐藏恶意程序真实的逻辑或数据。</td>
<td style="text-align:left">让杀软“<strong>看不懂</strong>”你在做什么。</td>
</tr>
</tbody>
</table></div>
<hr>
<h2 id="模块二企业内网与域安全active-directory" class="toc-header"><a class="toc-anchor" href="#模块二企业内网与域安全active-directory">¶</a> 🏢 模块二：企业内网与域安全（Active Directory）</h2>
<p>本模块词汇是内网渗透，特别是针对 Windows 域环境的基石。</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">中文术语</th>
<th style="text-align:left">英文术语</th>
<th style="text-align:left">定义与作用</th>
<th style="text-align:left">在攻防中的用途</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>活动目录</strong></td>
<td style="text-align:left">Active Directory (AD)</td>
<td style="text-align:left">微软提供的一套目录服务，用于集中管理 Windows 域环境下的用户、计算机和资源。</td>
<td style="text-align:left"><strong>内网核心。</strong> 渗透测试中首要的攻击目标。</td>
</tr>
<tr>
<td style="text-align:left"><strong>域控制器</strong></td>
<td style="text-align:left">Domain Controller (DC)</td>
<td style="text-align:left">运行 AD 服务的服务器，负责验证用户身份、存储所有账户信息和策略。</td>
<td style="text-align:left">掌握 DC 权限，即掌握了<strong>整个内网</strong>。</td>
</tr>
<tr>
<td style="text-align:left"><strong>组策略对象</strong></td>
<td style="text-align:left">Group Policy Object (GPO)</td>
<td style="text-align:left">一组配置规则，DC 用它来管理域内所有用户和计算机的行为和安全设置。</td>
<td style="text-align:left">攻击者常利用 GPO 漏洞来执行代码或修改系统配置。</td>
</tr>
<tr>
<td style="text-align:left"><strong>提权</strong></td>
<td style="text-align:left">Privilege Escalation</td>
<td style="text-align:left">在目标系统上从低权限提升至更高权限（如管理员、System、域管理员）。</td>
<td style="text-align:left">内网渗透的<strong>关键步骤</strong>。</td>
</tr>
<tr>
<td style="text-align:left"><strong>持久化</strong></td>
<td style="text-align:left">Persistence</td>
<td style="text-align:left">攻击者确保在系统重启或会话中断后，仍然能够重新连接和控制目标系统的技术。</td>
<td style="text-align:left">稳固战利品。</td>
</tr>
</tbody>
</table></div>
<hr>
<h2 id="模块三渗透基础设施与工具含网络测绘" class="toc-header"><a class="toc-anchor" href="#模块三渗透基础设施与工具含网络测绘">¶</a> 🚀 模块三：渗透基础设施与工具（含网络测绘）</h2>
<p>本模块词汇主要涉及攻防过程中使用的框架、扫描工具、网络侦察平台和实用工具。</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">中文术语</th>
<th style="text-align:left">英文术语</th>
<th style="text-align:left">定义与作用</th>
<th style="text-align:left">类别</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>C2 框架</strong></td>
<td style="text-align:left">Command &amp; Control (C2)</td>
<td style="text-align:left">用于远程控制上线目标机的服务器和工具系统。</td>
<td style="text-align:left"><strong>工具框架</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Nmap</strong></td>
<td style="text-align:left">Network Mapper</td>
<td style="text-align:left">著名的网络发现和安全审计工具，用于扫描主机、端口和识别服务。</td>
<td style="text-align:left"><strong>网络扫描</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Fscan</strong></td>
<td style="text-align:left">Fscan</td>
<td style="text-align:left">一款内网综合扫描工具，常用于快速发现内网中的存活主机和弱口令。</td>
<td style="text-align:left"><strong>内网扫描</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Burp Suite</strong></td>
<td style="text-align:left">Burp Suite</td>
<td style="text-align:left">一套用于测试 Web 应用程序安全性的集成平台，含代理、扫描器等。</td>
<td style="text-align:left"><strong>Web 安全</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Shodan / Fofa</strong></td>
<td style="text-align:left">Shodan / Fofa</td>
<td style="text-align:left">网络空间资产测绘平台，用于搜索暴露在互联网上的设备和服务指纹信息。</td>
<td style="text-align:left"><strong>网络测绘</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Netcat</strong></td>
<td style="text-align:left">Netcat (nc)</td>
<td style="text-align:left">一个极其灵活的网络工具，被称为“网络瑞士军刀”，常用于端口监听和数据传输。</td>
<td style="text-align:left"><strong>通用工具</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>reGeorg / NPS</strong></td>
<td style="text-align:left">reGeorg / NPS</td>
<td style="text-align:left">基于 Web 协议（如 HTTP(S)）或 Socks 协议的隧道工具。</td>
<td style="text-align:left"><strong>内网穿透</strong></td>
</tr>
</tbody>
</table></div>
<hr>
<h2 id="模块四网络基础与高级概念" class="toc-header"><a class="toc-anchor" href="#模块四网络基础与高级概念">¶</a> 🌐 模块四：网络基础与高级概念</h2>
<p>本模块词汇涵盖通信、协议、系统底层和对抗分析。</p>
<div class="table-container"><table>
<thead>
<tr>
<th style="text-align:left">中文术语</th>
<th style="text-align:left">英文术语</th>
<th style="text-align:left">定义与作用</th>
<th style="text-align:left">安全背景</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>反向连接</strong></td>
<td style="text-align:left">Reverse Connection</td>
<td style="text-align:left">由目标机器主动连接回攻击者服务器，用于绕过目标防火墙对入站流量的限制。</td>
<td style="text-align:left">C2 通信技术</td>
</tr>
<tr>
<td style="text-align:left"><strong>SOCKS 协议</strong></td>
<td style="text-align:left">SOCKS Protocol</td>
<td style="text-align:left">一种网络协议，用于在客户端和服务器之间建立代理连接，可代理任何流量。</td>
<td style="text-align:left">内网穿透中建立<strong>隧道</strong>。</td>
</tr>
<tr>
<td style="text-align:left"><strong>HTTPS</strong></td>
<td style="text-align:left">HTTPS</td>
<td style="text-align:left">HTTP 协议的安全版本，通过 <strong>SSL/TLS</strong> 协议进行加密通信。</td>
<td style="text-align:left">C2 通信中常用于伪装流量。</td>
</tr>
<tr>
<td style="text-align:left"><strong>数字证书</strong></td>
<td style="text-align:left">Digital Certificate</td>
<td style="text-align:left">用于验证服务器身份的电子文件，是 HTTPS 信任的基础。</td>
<td style="text-align:left">C2 基础设施部署（用于伪造 C2 证书）</td>
</tr>
<tr>
<td style="text-align:left"><strong>AV / EDR</strong></td>
<td style="text-align:left">Antivirus / EDR</td>
<td style="text-align:left">杀毒软件 / 终端检测与响应系统，负责阻止恶意活动。</td>
<td style="text-align:left">攻击者必须绕过的防御系统。</td>
</tr>
<tr>
<td style="text-align:left"><strong>Windows 内核</strong></td>
<td style="text-align:left">Windows Kernel</td>
<td style="text-align:left">操作系统最核心的部分，负责管理系统资源和硬件，拥有最高权限。</td>
<td style="text-align:left">内核级提权是最高级别的目标。</td>
</tr>
<tr>
<td style="text-align:left"><strong>VMware/VirtualBox</strong></td>
<td style="text-align:left">VM</td>
<td style="text-align:left">在宿主机上模拟出的隔离计算机环境。</td>
<td style="text-align:left">搭建靶场、运行恶意代码的<strong>必备安全环境</strong>。</td>
</tr>
</tbody>
</table></div>
