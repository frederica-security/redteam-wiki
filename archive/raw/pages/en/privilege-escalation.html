<h2 id="h-1-引言hard-mode-开启" class="toc-header"><a class="toc-anchor" href="#h-1-引言hard-mode-开启">¶</a> 1. 引言：Hard Mode 开启</h2>
<p>在上一章《Bypass UAC》中，我们的生活很美好：我们本来就在 <strong>Administrators</strong> 组里，只需要用一点小手段绕过弹窗，就能获得至高无上的权力。</p>
<p>但在现实的红队行动中，<strong>90% 的情况</strong>是你通过钓鱼邮件，横向移动或 Web 漏洞拿到的 Shell，只是一个<strong>卑微的普通用户/域用户</strong>（比如 <code>User</code> 或 <code>IIS AppPool</code>）。</p>
<p>这时候，你再用 UACME 是没用的，因为你的“身份证”上根本就没有“管理员”这三个字。你不需要“解锁”，你需要的是<strong>篡位</strong>。</p>
<p>这一章，我们将探讨如何从<strong>普通用户 (Pawn)</strong> 逆袭成为 <strong>SYSTEM (Queen)</strong>。我们将跟随 Windows 提权大师 <strong>James Forshaw</strong> 的思路，学习一种不需要写汇编代码的高级艺术——<strong>逻辑提权</strong>。</p>
<hr>
<h2 id="h-2-暴力破解-vs-逻辑欺骗" class="toc-header"><a class="toc-anchor" href="#h-2-暴力破解-vs-逻辑欺骗">¶</a> 2. 暴力破解 vs. 逻辑欺骗</h2>
<p>想要获得更高的权限，通常有两条路：</p>
<ul>
<li><strong>路子正（内存破坏）：</strong> 寻找 Windows 内核的缓冲区溢出漏洞（Kernel Exploit）。这就像是拿着大锤去砸宫殿的墙，进行正面猛攻。但现在微软把墙修得越来越厚（SMEP, ASLR, KVA），这条路越来越难走，而且容易把系统搞蓝屏。</li>
<li><strong>路子巧（逻辑漏洞）：</strong> 这是 James Forshaw 提倡的方法。<strong>我们不砸墙，我们骗保安。</strong>
<ul>
<li>逻辑提权的本质是：<strong>利用系统原本合法的“规则”，组合出程序员意想不到的“后果”。</strong></li>
</ul>
</li>
</ul>
<hr>
<h2 id="h-3-知己知彼宫殿的规则-windows-internals" class="toc-header"><a class="toc-anchor" href="#h-3-知己知彼宫殿的规则-windows-internals">¶</a> 3. 知己知彼：宫殿的规则 (Windows Internals)</h2>
<p>要骗过保安，你得先懂宫殿的规矩。在 Windows 里，权限控制主要看三个东西：</p>
<h3 id="h-1️⃣-你的工牌token-访问令牌" class="toc-header"><a class="toc-anchor" href="#h-1️⃣-你的工牌token-访问令牌">¶</a> 1️⃣ 你的工牌：Token (访问令牌)</h3>
<p>每个进程都有一个 Token。它决定了你是谁。</p>
<ul>
<li><strong>普通用户 Token：</strong> 只能访问自己的桌面和文档。</li>
<li><strong>SYSTEM Token：</strong> 拥有整个操作系统的生杀大权。</li>
</ul>
<blockquote>
<p><strong>提权的目标：</strong> 偷到一个 SYSTEM 的 Token，贴在自己脑门上。</p>
</blockquote>
<h3 id="h-2️⃣-门禁名单dacl-访问控制列表" class="toc-header"><a class="toc-anchor" href="#h-2️⃣-门禁名单dacl-访问控制列表">¶</a> 2️⃣ 门禁名单：DACL (访问控制列表)</h3>
<p>每个文件和服务都有一张名单。</p>
<ul>
<li>通常，<code>C:\Windows\System32</code> 的名单上写着：<code>Administrator: Full Control</code>，<code>User: Read Only</code>。</li>
<li>这就是为什么你无法替换系统文件的原因。</li>
</ul>
<h3 id="h-3️⃣-女皇的替身impersonation-模拟" class="toc-header"><a class="toc-anchor" href="#h-3️⃣-女皇的替身impersonation-模拟">¶</a> 3️⃣ 女皇的替身：Impersonation (模拟)</h3>
<p>这是 Windows 最容易被利用的机制。</p>
<ul>
<li><strong>原理：</strong> 系统服务（SYSTEM 权限）经常需要帮用户办事。为了安全，服务会暂时**“模拟”**成那个用户的权限去办事。</li>
<li><strong>漏洞：</strong> 如果我们能诱骗一个 SYSTEM 服务来连接我们（比如通过命名管道 Named Pipe），并且它<strong>忘记</strong>了降级（或者我们可以利用某种技巧捕获它的凭证），我们就能把它的 Token 偷过来！</li>
</ul>
<hr>
<h2 id="h-4-寻找猎物攻击面枚举-hunting" class="toc-header"><a class="toc-anchor" href="#h-4-寻找猎物攻击面枚举-hunting">¶</a> 4. 寻找猎物：攻击面枚举 (Hunting)</h2>
<p>作为一个小兵，我们要在系统里四处游荡，寻找那些<strong>配置错误</strong>或<strong>逻辑不严谨</strong>的角落。</p>
<h3 id="h-1️⃣-寻找忘了锁的门-weak-permissions" class="toc-header"><a class="toc-anchor" href="#h-1️⃣-寻找忘了锁的门-weak-permissions">¶</a> 1️⃣ 寻找“忘了锁的门” (Weak Permissions)</h3>
<p>有些软件安装时很粗心，把安装目录设为了 <code>Everyone: Full Control</code>。</p>
<ul>
<li><strong>实战：</strong> 如果你发现一个以 SYSTEM 权限运行的杀毒软件，它的服务主程序竟然允许你<strong>修改</strong>。</li>
<li><strong>操作：</strong> 把你的木马改名为该杀毒软件的名字，重启服务。</li>
<li><strong>结果：</strong> 系统自动以 SYSTEM 权限启动了你的木马。</li>
</ul>
<h3 id="h-2️⃣-寻找傻瓜服务-unquoted-service-path" class="toc-header"><a class="toc-anchor" href="#h-2️⃣-寻找傻瓜服务-unquoted-service-path">¶</a> 2️⃣ 寻找“傻瓜服务” (Unquoted Service Path)</h3>
<ul>
<li><strong>原理：</strong> Windows 解析路径的逻辑缺陷。
<ul>
<li>路径：<code>C:\Program Files\My App\service.exe</code></li>
<li>如果路径没加引号，系统会按顺序尝试运行：
<ol>
<li><code>C:\Program.exe</code> ❌</li>
<li><code>C:\Program Files\My.exe</code> ❌</li>
<li><code>C:\Program Files\My App\service.exe</code> ✅</li>
</ol>
</li>
</ul>
</li>
<li><strong>利用：</strong> 如果你有权限在 C 盘根目录写文件，你就放一个恶意的 <code>Program.exe</code>。下次服务重启时，它就会错误地执行你的程序！</li>
</ul>
<h3 id="h-3️⃣-寻找热心肠的仆人-potato-attacks-named-pipes" class="toc-header"><a class="toc-anchor" href="#h-3️⃣-寻找热心肠的仆人-potato-attacks-named-pipes">¶</a> 3️⃣ 寻找“热心肠的仆人” (Potato Attacks / Named Pipes)</h3>
<p>这是基于 James Forshaw 理论最经典的实战应用（如 JuicyPotato, PrintNightmare）。</p>
<ul>
<li><strong>剧本：</strong>
<ol>
<li><strong>设局：</strong> 我们创建一个恶意的 COM 对象或 RPC 服务器（想象成一个虚假的求助站）。</li>
<li><strong>诱骗：</strong> 我们强行触发一个高权限的 SYSTEM 服务（如 DCOM 服务），让它来访问我们的求助站。</li>
<li><strong>窃取：</strong> 当 SYSTEM 服务连接我们时，它会携带它的身份凭证（Token）。</li>
<li><strong>伪装：</strong> 我们利用 Windows 的 API（<code>ImpersonateNamedPipeClient</code>），直接把这个 SYSTEM Token 拿过来，变成了我们自己的。</li>
</ol>
</li>
</ul>
<hr>
<h2 id="h-5-逻辑漏洞的高级艺术符号链接-symlinks" class="toc-header"><a class="toc-anchor" href="#h-5-逻辑漏洞的高级艺术符号链接-symlinks">¶</a> 5. 逻辑漏洞的高级艺术：符号链接 (Symlinks)</h2>
<p>James Forshaw 最擅长的领域。这是一种<strong>隔山打牛</strong>的战术。</p>
<p><strong>场景：</strong><br>
有一个系统服务，任务是定期清理 <code>C:\Temp\log.txt</code>。它是 SYSTEM 权限。</p>
<p><strong>攻击逻辑：</strong></p>
<ol>
<li><strong>观察：</strong> 我们发现这个服务在删除文件前，没有严格检查文件是不是真的日志。</li>
<li><strong>偷梁换柱：</strong> 我们删掉 <code>log.txt</code>，并在原地建立一个<strong>符号链接 (Mount Point / Junction)</strong>，指向 <code>C:\Windows\System32\drivers\pci.sys</code>（关键驱动文件）。</li>
<li><strong>借刀杀人：</strong> 服务再次运行时，它以为自己在删日志，实际上顺着我们的链接，把系统的关键驱动删了！</li>
<li><strong>提权：</strong> 同样的逻辑，如果服务是<strong>写文件</strong>，我们就能让它帮我们把恶意 DLL 写入 System32 目录。</li>
</ol>
<blockquote>
<p><strong>核心思想：</strong> 我没有权限写系统目录，但我可以把一个“我有权写的地方”变成“通往系统目录的虫洞”。</p>
</blockquote>
<hr>
<h2 id="h-6-实战兵器从手工到自动化" class="toc-header"><a class="toc-anchor" href="#h-6-实战兵器从手工到自动化">¶</a> 6. 实战兵器：从手工到自动化</h2>
<p>理解了原理，实战中我们通常使用封装好的工具。</p>
<ul>
<li><strong>PowerUp (PowerShell):</strong> 经典的枚举工具。
<ul>
<li><code>Invoke-AllChecks</code>：自动帮你扫描有没有“没加引号的服务路径”、“权限错误的注册表键值”等。</li>
</ul>
</li>
<li><strong>Potato Family (土豆家族):</strong>
<ul>
<li><code>JuicyPotato</code> / <code>RottenPotato</code> / <code>SweetPotato</code>：专门利用 COM/RPC 机制骗取 SYSTEM Token 的神器。</li>
</ul>
</li>
<li><strong>PrintNightmare / SpoolSample:</strong> 利用打印机服务（Spooler）的逻辑漏洞，强制让域控制器或者本机回连我们，从而窃取凭证。</li>
</ul>
<hr>
<h2 id="h-7-总结核心思维方式" class="toc-header"><a class="toc-anchor" href="#h-7-总结核心思维方式">¶</a> 7. 总结：核心思维方式</h2>
<p>从 Bypass UAC 到 Privilege Escalation，你会发现利用思维的转变：</p>
<ul>
<li><strong>Bypass UAC</strong> 是在想：<strong>“我是没带钥匙的老板，怎么让保安别管我？”</strong></li>
<li><strong>Privilege Escalation</strong> 是在想：<strong>“我只是个扫地的，但我怎么诱骗老板把金库钥匙落在我这里？”</strong></li>
</ul>
<p>逻辑提权不需要你对抗昂贵的杀毒软件内存防御，你需要对抗的是<strong>程序员的逻辑疏忽</strong>。只要系统里还存在“服务帮用户办事”的逻辑，这种提权路径就永远存在。</p>
