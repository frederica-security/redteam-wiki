<p>假设一个场景：你掌握一些基础的攻击能力，但现在你的目标是入侵地球上最大的软件公司。<br>
需要怎么做？拿起扫描器对着浩如烟海的子域名进行扫描吗？几乎每一处资产都经过细致入微的人工渗透，各大漏洞赏金平台的白帽子也日夜不停地搜索着这些资产的每一个细小的哪怕只是XSS的漏洞。利用漏洞？一旦新的0day漏洞被披露，他们的安全部门会第一时间知晓并且做出安全处置。钓鱼攻击？听上去是最有希望的方法，而且往往能够得手，然而一旦尝试横向移动就会发现寸步难行，各种安全策略和安全设备加上严格隔离的网络环境足以让入侵者步履维艰。</p>
<hr>
<p>故事的开头极其低调。<br>
2019年9月，一群身份不明、极具耐心的黑客悄无声息地潜入了一家软件公司的内部网络。他们并没有急着去偷数据，而是像隐身人一样，在公司的各个角落观察、游荡。<br>
他们发现了一个宝贝：一款全球成千上万政府机构、五百强企业都在使用的网络管理平台。黑客意识到，只要能给这个“管理软件”动点手脚，他们就等于拥有了通往这些顶级客户大门的“万能钥匙”。<br>
为了确保不被发现，他们在2019年10月进行了一次“试运行”。他们在软件更新包里植入了一段空白代码，然后静静观察：开发人员发现了没？编译系统报错了没？数字签名通过了没？<br>
结果是：没人察觉。<br>
于是，在2020年初，黑客正式植入了恶意代码。这段代码非常狡猾，它长得和普通的系统组件一模一样，甚至还有官方的数字签名。<br>
2020年3月，这家公司像往常一样发布了软件更新。<br>
全球约 18,000个 组织——包括各大政府部门/顶级科技公司——都收到了更新提示。本着对信任供应商的原则，管理员们点击了“更新”。<br>
那一刻，木马随着正版更新流向了全球。同时，它会“冬眠”12到14天，并检查环境是否安全（比如是否被安全软件监控）。一旦确认安全，它就会连接黑客的控制中心，彻底打开后门。<br>
如果不是因为一个“多余”的手机通知，这起攻击可能至今都不会被发现。<br>
2020年12月，一家网络安全公司的一名员工在登录系统时，手机弹出了一个二次认证（MFA）请求。但这名员工当时并没有登录。<br>
他们立即意识到：有人在冒充他们的员工。<br>
经过深入挖掘，他们惊恐地发现，自家坚不可摧的防线竟然是从内部被攻破的——而源头正是那个看起来人畜无害的管理软件。12月13日，他们正式向全世界通报了这一灾难。<br>
随着调查深入，人们发现损失惨重：黑客潜伏时长超过 15 个月。<strong>通过这种正常渠道下发并带有官方数字签名的恶意软件，已经横扫各大巨型企业和政府部门，包括当今世界上最大的软件公司。</strong><br>
低级失误： 调查中发现，这家软件供应商的一个更新服务器密码竟然是弱口令，且已在网上暴露了一年多。虽然这不一定是攻击的唯一入口，但却成了行业内的笑柄。<br>
这次事件改变了全球对“信任”的定义。它告诉我们：你最信任的供应商，可能就是黑客最完美的跳板。<br>
从此，“零信任架构”从学术概念变成了各大企业的救命稻草。这场风暴虽然平息了，但它留下的阴影依然笼罩在网络空间的每一个角落。</p>
<hr>
<p>现代软件开发和交付过程已经高度依赖于现有代码和软件供应链体系。思考一下，你最近编写的程序调用了哪些库？如果这些库/组件被植入了恶意代码或者被发现了命令执行漏洞，会发生什么？<br>
供应链攻击并不像利用漏洞攻击那样死板。它更像是钓鱼攻击：要针对最终目标做细致入微的策划与调整。<br>
例如，通过信息收集，我们知道了A公司（一家庞大的金融企业）的工单系统是由B公司开发的，B公司是一家专门做软件外包的小型企业，并没有任何安全人员，也没有采购任何安全设备。通过钓鱼攻击，我们立刻就取得了B公司的入口权限，随后在内网横向移动并获取了存放工单系统源代码的Git服务器权限。不过，这款软件是通过人工部署的，因此利用软件更新来感染A公司并不现实。但是，既然我们能够查看到工单系统的源代码，那么可以挖掘出工单系统的0day漏洞，并借此发动一次0day攻击，获取A公司部署工单系统服务器的权限，以此来深入A公司的内部网络。<br>
再看另一个场景。这次是一个人员管理系统，存放着A公司的全部人员信息，因此非常重要，外包C公司派遣了专门人员负责这个系统的日常维护。C公司是A公司的外包，他们的维护人员并不具备特别强的安全意识。通过钓鱼，我们获取了C公司维护人员的工作电脑的权限。同时，利用当前的权限，我们能够在维护人员电脑的浏览器中抓取密码和Cookie，当他们再次接入A公司的网络时，我们利用他们的工作电脑作为跳板，同时抓取人员管理系统的运维账号密码，从而登录到目标系统中。<br>
第三方库？第三方软件？外包人员？运维账号？软件供应商遗留的测试账号？这些都可能成为突破口，最坚固的堡垒往往从内部被攻破。</p>
