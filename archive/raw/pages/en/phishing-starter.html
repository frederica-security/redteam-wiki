<p>有了伪装技术，还需要话术配合。而话术是用来建立信任关系的，有了足够的信任关系，才可以驱使对方进行一些非常规行为。</p>
<h3 id="话术一应聘招聘最泛用" class="toc-header"><a class="toc-anchor" href="#话术一应聘招聘最泛用">¶</a> 💼 话术一：应聘/招聘（最泛用）</h3>
<p><strong>为什么应聘招聘的模式很泛用？</strong></p>
<p>没有哪家公司不招人，除非它太小了，就算裁员期的公司也招人。<br>
没有哪家公司的员工不想跳槽，就算待遇很好，也难免有工作不顺心的时候。<br>
而且：</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">
1. HR 不是技术人员，安全意识相对薄弱
2. 简历有"分发属性"（HR 会转给用人部门）
3. 可以通过第三方平台建立信任
4. 应聘者可能面临裁员危机 急着找工作

</code></pre>
<p><strong>完整话术示例：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">主题：应聘【前端开发工程师】- 张三 - 3年经验

您好，李经理：

我叫张三，毕业于XX大学，3年前端开发经验。
在 Boss 直聘上看到贵司在招聘前端工程师，非常感兴趣。

我的技术栈：
- Vue 3 / React 18
- TypeScript
- 微前端架构

附件是我的简历和作品集，麻烦查看。

期待您的回复！

张三
手机：138-0000-1234
微信：zhang_san_dev
</code></pre>
<p><strong>附件：</strong></p>
<ul>
<li><code>张三-前端开发-3年.7z</code>（解压后包含<strong>个人简历.pdf.lnk</strong>）</li>
</ul>

<h3 id="话术四可信站点中转" class="toc-header"><a class="toc-anchor" href="#话术四可信站点中转">¶</a> 💼 话术四：可信站点中转</h3>
<p><strong>问题：</strong> 邮件网关会扫描附件</p>
<p><strong>解决：</strong> 把木马传到目标公司自己的网站</p>
<p><strong>操作步骤：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">1. 找到目标公司的某个可上传文件的地方
   - 论坛
   - 文件分享平台
   - 招聘系统

2. 上传你的木马
   获得下载链接：https://目标公司.com/files/简历.7z

3. 发送钓鱼邮件：
   "这是我的简历，已经传过一次你们的招聘系统了：https://目标公司.com/files/简历.7z"
</code></pre>
<p><strong>为什么有效？</strong></p>
<ul>
<li>下载链接是目标公司自己的域名</li>
<li>邮件网关可能不会拦截自己域名的链接</li>
<li>用户看到是公司域名，更容易信任</li>
</ul>
<hr>
<h3 id="话术五第三方平台引流" class="toc-header"><a class="toc-anchor" href="#话术五第三方平台引流">¶</a> 💼 话术五：第三方平台引流</h3>
<p><strong>场景：</strong> 通过招聘网站建立信任</p>
<p><strong>操作流程：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">1. 在 Boss 直聘上找到目标公司的招聘信息
2. 投递简历（正常的简历，不含木马）
3. 和 HR 聊天，建立信任
4. HR："能发一下你的详细简历吗？"
5. 你："好的，我用邮件发给您"
6. 发送钓鱼邮件（此时 HR 已经信任你）
</code></pre>
<hr>
<h2 id="电话沟通国内特色的钓鱼加速器" class="toc-header"><a class="toc-anchor" href="#电话沟通国内特色的钓鱼加速器">¶</a> 电话沟通：国内特色的"钓鱼加速器"</h2>
<h3 id="为什么电话沟通在国内特别有效" class="toc-header"><a class="toc-anchor" href="#为什么电话沟通在国内特别有效">¶</a> 📞 为什么电话沟通在国内特别有效？</h3>
<p><strong>国内的特殊文化背景：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">1. 中国人重视"人情"，电话沟通后更容易信任
2. 很多企业员工习惯电话确认邮件内容
3. 语音比文字更容易建立信任感
4. 可以实时引导，解决对方的疑虑
</code></pre>
<p><strong>数据对比：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">仅发邮件的成功率：10-15%
邮件 + 电话的成功率：30-40%
</code></pre>
<hr>
<h3 id="电话沟通的三个时机" class="toc-header"><a class="toc-anchor" href="#电话沟通的三个时机">¶</a> 📞 电话沟通的三个时机</h3>
<h4 id="时机一发送邮件前" class="toc-header"><a class="toc-anchor" href="#时机一发送邮件前">¶</a> 时机一：发送邮件前</h4>
<p><strong>场景：</strong> 伪装成求职者</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">对话示例：

你："您好，是李经理吗？我在 Boss 上看到贵司在招前端开发。"
HR："是的，你是？"
你："我叫张三，有 3 年经验，想应聘这个职位。"
HR："好的，你把简历发到 hr@xxx.com"
你："好的，我马上发，麻烦您查收。"

（挂断电话后立即发送钓鱼邮件）
</code></pre>
<p><strong>为什么有效？</strong></p>
<ul>
<li>✅ 建立了真实的联系</li>
<li>✅ HR 会主动去找你的邮件</li>
<li>✅ 有了电话沟通，HR 不会怀疑邮件的真实性</li>
</ul>
<hr>
<h4 id="时机二发送邮件后最常用" class="toc-header"><a class="toc-anchor" href="#时机二发送邮件后最常用">¶</a> 时机二：发送邮件后（最常用）</h4>
<p><strong>场景：</strong> 对方可能在手机上查看邮件</p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">等待 10-15 分钟后打电话：

你："您好，李经理，我是刚才给您投简历的张三。"
HR："哦，我看到邮件了。"
你："麻烦您查收一下，如果有任何问题可以随时联系我。"
HR："好的，我看看。"

（如果对方在手机上）
HR："诶，我在手机上打不开你的简历。"
你："哦，不好意思，我这个简历是用 Word 编辑的，用手机可能打不开。您方便的话，在电脑上用 Word 打开一下就可以了。"
</code></pre>
<p><strong>关键话术：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">"这个文件是在电脑上编辑的，需要用 Word/Excel 打开"
"手机上可能显示不正常，建议在电脑上查看"
"我的作品集里有一些交互效果，手机上看不了"
</code></pre>

<h2 id="诱导话术让目标按你的意图行动" class="toc-header"><a class="toc-anchor" href="#诱导话术让目标按你的意图行动">¶</a> 诱导话术：让目标按你的意图行动</h2>
<h3 id="核心原则引导而非命令" class="toc-header"><a class="toc-anchor" href="#核心原则引导而非命令">¶</a> 🎭 核心原则：引导而非命令</h3>
<p><strong>错误示例：</strong></p>

</code></pre>
<hr>
<h3 id="场景一引导用电脑而非手机" class="toc-header"><a class="toc-anchor" href="#场景一引导用电脑而非手机">¶</a> 🎭 场景一：引导用电脑而非手机</h3>
<p><strong>对方：</strong> "我在手机上看一下"</p>
<p><strong>你的回应：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">选项 1（强调内容）：
"我的简历里有一些作品集的演示视频链接，手机上看可能加载比较慢。建议您在电脑上看，体验会好很多。"

选项 2（强调格式）：
"我用 Word 做了一些排版设计，手机上可能显示不太正常。您方便的话，在电脑上用 Office 打开一下吧。"

<h3 id="场景二引导关闭杀毒软件" class="toc-header"><a class="toc-anchor" href="#场景二引导关闭杀毒软件">¶</a> 🎭 场景二：引导关闭杀毒软件</h3>
<p><strong>对方：</strong> "电脑提示这个文件有风险"</p>

选项 2（从众心理）：

选项 3（转移责任）：
"哦，您公司的安全策略比较严格啊。要不您先保存到桌面，然后加到信任列表里再打开？我之前有个朋友的公司也是这样。"
</code></pre>

<h3 id="场景三引导启用宏" class="toc-header"><a class="toc-anchor" href="#场景三引导启用宏">¶</a> 🎭 场景三：引导启用宏</h3>

<h2 id="plan-b当办公台式机失手时的夜间作战" class="toc-header"><a class="toc-anchor" href="#plan-b当办公台式机失手时的夜间作战">¶</a> Plan B：当办公台式机失手时的"夜间作战"</h2>
<h3 id="为什么要等到晚上" class="toc-header"><a class="toc-anchor" href="#为什么要等到晚上">¶</a> 🌙 为什么要等到晚上？</h3>
<p><strong>场景：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">你给目标公司的 HR 发了简历
等了一整天，Beacon 没有上线
查看邮件回执：邮件被打开了
但是没有机器上线

可能的原因：
1. 办公台式机有严格的 EDR
2. 网络出口有严格的防火墙策略
3. 目标在虚拟机/沙箱中打开了文件
4. 木马被杀软拦截了
</code></pre>
<p><strong>这时候，不要放弃。等到晚上，目标可能会：</strong></p>
<hr>
<h3 id="两用机你的第二战场" class="toc-header"><a class="toc-anchor" href="#两用机你的第二战场">¶</a> 💻 两用机：你的"第二战场"</h3>
<p><strong>什么是两用机？</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">笔记本电脑，既是办公设备，也是个人娱乐设备

员工白天在公司办公：
→ 连接公司有线网络
→ 受到严格的安全策略管控
→ 有 EDR、防火墙、网络监控

员工晚上带回家：
→ 连接家里的 WiFi
→ 可能还会 VPN 回公司内网
→ 安全策略松懈很多
</code></pre>
<hr>
<h3 id="两用机的三大特点" class="toc-header"><a class="toc-anchor" href="#两用机的三大特点">¶</a> 🎯 两用机的三大特点</h3>
<h4 id="特点一安全措施相对松懈" class="toc-header"><a class="toc-anchor" href="#特点一安全措施相对松懈">¶</a> 特点一：安全措施相对松懈</h4>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">办公台式机：
✅ 强制安装 EDR
✅ USB 端口禁用
✅ 应用白名单
✅ 网络严格管控

两用机（笔记本）：
❌ 可能没装 EDR（影响性能，员工会抱怨）
❌ 可能只装了轻量级杀软
❌ 网络策略相对宽松（需要远程办公）
❌ 可能有本地管理员权限
</code></pre>
<p><strong>原因：</strong></p>
<ul>
<li>笔记本需要在家办公，不能管控太死</li>
<li>员工经常抱怨 EDR 影响性能，IT 部门可能妥协</li>
<li>管理笔记本比管理台式机困难得多</li>
</ul>
<hr>
<h4 id="特点二网络环境特殊" class="toc-header"><a class="toc-anchor" href="#特点二网络环境特殊">¶</a> 特点二：网络环境特殊</h4>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">情况 1：在家连接家庭 WiFi
→ 完全没有公司的网络安全设备
→ 木马可以自由出网
→ 但此时无法访问公司内网

情况 2：在家连接 VPN
→ 既可以出网（通过家庭网络）
→ 又可以访问内网（通过 VPN）
→ 这是最理想的情况！

情况 3：在咖啡厅/高铁上连热点
→ 如果目标公司内网不出网
→ 员工可能会用手机热点让电脑出网
→ 然后通过 VPN 访问内网
</code></pre>
<hr>
<h4 id="特点三时间窗口可预测" class="toc-header"><a class="toc-anchor" href="#特点三时间窗口可预测">¶</a> 特点三：时间窗口可预测</h4>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">晚上 19:00 - 23:00：
- 员工回家后可能继续工作
- 或者打游戏、看视频（两用机的典型用途）
- 这是你的黄金时间窗口

周末：
- 员工在家加班
- 更可能使用笔记本
- 安全监控更少
</code></pre>
<hr>
<h3 id="针对两用机的钓鱼策略" class="toc-header"><a class="toc-anchor" href="#针对两用机的钓鱼策略">¶</a> 🎣 针对两用机的钓鱼策略</h3>
<h4 id="策略一卡时间重新钓鱼" class="toc-header"><a class="toc-anchor" href="#策略一卡时间重新钓鱼">¶</a> 策略一：卡时间重新钓鱼</h4>
<p><strong>场景：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">白天：给目标发了简历，没有上线
晚上 19:00：重新发一封邮件
</code></pre>
<p><strong>话术示例：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">主题：Re: 应聘【前端开发工程师】- 张三 - 补充材料

李经理，您好：

不好意思打扰您了，我刚才想起来，忘记在简历里附上我的作品集了。

我重新整理了一下，麻烦您查看：
- 附件是完整版简历（包含作品集链接）
- 我的 GitHub：github.com/zhangsan

期待您的回复！

张三
</code></pre>
<p><strong>为什么有效？</strong></p>
<ul>
<li>员工晚上可能在家用笔记本处理邮件</li>
<li>此时电脑的安全措施可能更宽松</li>
<li>员工警惕性降低（已经下班了）</li>
</ul>
<hr>
<h4 id="策略二发送娱乐类文件" class="toc-header"><a class="toc-anchor" href="#策略二发送娱乐类文件">¶</a> 策略二：发送"娱乐类"文件</h4>
<p><strong>白天的钓鱼文件：</strong> 简历、报告、合同（看起来很正式）</p>
<p><strong>晚上的钓鱼文件：</strong> 游戏外挂、破解软件、视频（员工的娱乐需求）</p>
<p><strong>示例：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">场景：你发现目标公司的员工在某个游戏论坛很活跃

你在论坛发帖：
"分享一个 XXX 游戏的辅助工具，亲测有效！"
附件：游戏辅助.exe（实际是木马）

或者通过私信：
"兄弟，看你也在玩 XXX，我这有个挺好用的工具，发你试试"
</code></pre>
<p><strong>为什么有效？</strong></p>
<ul>
<li>员工晚上用笔记本打游戏是常见场景</li>
<li>游戏玩家对"辅助工具"有强烈需求</li>
<li>娱乐时的警惕性远低于工作时</li>
</ul>
<hr>
<h4 id="策略三针对手机热点场景" class="toc-header"><a class="toc-anchor" href="#策略三针对手机热点场景">¶</a> 策略三：针对"手机热点"场景</h4>
<p><strong>场景：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">某些公司的内网完全不出网
员工需要访问外网时：
1. 打开手机热点
2. 笔记本连接热点
3. 同时保持 VPN 连接到内网

这时候：
- 笔记本可以访问内网
- 笔记本可以访问外网
- 你的 C2 可以连接成功！
</code></pre>
<p><strong>如何判断目标公司不出网？</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">1. 查看招聘信息：
   "公司内网与互联网物理隔离"
   "办公网络采用双网隔离"

2. 查看员工抱怨：
   在脉脉/V2EX 等平台搜索
   "XXX 公司内网不能上网好烦"

3. 社工询问：
   伪装成面试者："请问贵司办公电脑可以上网吗？"
</code></pre>
<p><strong>钓鱼策略：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">既然员工需要用热点才能访问外网
那我们就在他们需要访问外网的时候下钩

示例话术（通过招聘平台聊天）：

你："李经理，我整理了一份详细的项目文档"
你："不过文档在我的云盘上，我发个链接给您吧"
你："链接：https://你的C2服务器/project-doc.7z"

HR 要下载：
→ 发现内网下载不了
→ 打开手机热点
→ 下载并运行
→ Beacon 上线（通过热点出网）
→ VPN 还连着，可以访问内网
</code></pre>

22:00 - 23:00  睡前突击

<h3 id="️-两用机钓鱼的注意事项" class="toc-header"><a class="toc-anchor" href="#️-两用机钓鱼的注意事项">¶</a> ⚠️ 两用机钓鱼的注意事项</h3>
<h4 id="注意一c2-配置要支持多网络环境" class="toc-header"><a class="toc-anchor" href="#注意一c2-配置要支持多网络环境">¶</a> 注意一：C2 配置要支持多网络环境</h4>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">办公环境：
- 可能通过代理出网
- 可能只能访问特定端口

家庭环境：
- 直接连接互联网
- 几乎没有限制

热点环境：
- 运营商可能有限制
- 网络不稳定

你的 C2 需要：
→ 支持多种通信协议（HTTP/HTTPS/DNS）
→ 支持多个监听端口
→ 有域前置（Domain Fronting）能力
</code></pre>
<hr>
<h4 id="注意二时间窗口有限" class="toc-header"><a class="toc-anchor" href="#注意二时间窗口有限">¶</a> 注意二：时间窗口有限</h4>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">笔记本在家：
- 可能只开机 2-3 小时
- 随时可能关机睡觉

你需要：
→ 快速建立持久化：并且通过powercfg避免休眠
→ 快速导出关键信息
→ 快速进行横向移动（如果有 VPN）
</code></pre>
<hr>
<h4 id="注意三行为要隐蔽" class="toc-header"><a class="toc-anchor" href="#注意三行为要隐蔽">¶</a> 注意三：行为要隐蔽</h4>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">在家使用电脑：
- 员工可能更容易注意到异常
- 风扇声音变大
- 电脑变卡
- 杀软弹窗

要做到：
→ 降低 CPU 使用率
→ 避免频繁的网络通信
→ 不要触发杀软行为检测
</code></pre>
<hr>
<h3 id="成功案例夜间突破的真实故事" class="toc-header"><a class="toc-anchor" href="#成功案例夜间突破的真实故事">¶</a> 📊 成功案例：夜间突破的真实故事</h3>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">目标：某互联网公司
尝试：白天发送简历钓鱼，失败（EDR 拦截）

Plan B：

关键信息：

- 同时连接家庭 WiFi
- 既能出网，又能访问内网
- 一夜之间完成了内网渗透

结果：
- 通过该笔记本，访问了公司 GitLab
- 下载了大量源代码

<h3 id="为什么两用机是软肋" class="toc-header"><a class="toc-anchor" href="#为什么两用机是软肋">¶</a> 🤔 为什么两用机是"软肋"？</h3>
<p><strong>从管理角度：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">台式机：
→ 放在公司，IT 部门完全控制
→ 可以强制安装各种安全软件
→ 员工无法拆卸/修改

笔记本：
→ 员工带回家，IT 部门难以管控
→ 安装太多安全软件，员工会抱怨卡顿
→ 员工可能自己"优化"（卸载安全软件）
</code></pre>
<p><strong>从技术角度：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">台式机：
→ 有线网络，稳定可控
→ 统一的网络策略
→ 统一的安全基线

笔记本：
→ WiFi 连接，环境多变
→ 家庭网络、公共网络、热点
→ 难以统一管控
</code></pre>
<p><strong>从心理角度：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">在公司：
→ 警惕性高
→ 有安全意识培训
→ 有同事的"监督"

在家：
→ 警惕性低
→ "这是我自己的电脑"（虽然是公司的）
→ "反正在家，没人看见"
</code></pre>
<hr>
<h2 id="邮件回执谁打开了你的邮件" class="toc-header"><a class="toc-anchor" href="#邮件回执谁打开了你的邮件">¶</a> 邮件回执：谁打开了你的邮件？</h2>
<h3 id="为什么需要回执" class="toc-header"><a class="toc-anchor" href="#为什么需要回执">¶</a> 🔍 为什么需要回执？</h3>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">你收集了 100 个邮箱
不知道哪些还在使用
不知道哪些人会查看邮件

有了回执：
→ 知道谁打开了邮件
→ 知道什么时间打开的
→ 可以判断是否在手机上打开
→ 可以决定是否需要二次钓鱼
</code></pre>
<hr>
<h3 id="启用邮件回执的方法" class="toc-header"><a class="toc-anchor" href="#启用邮件回执的方法">¶</a> 📧 启用邮件回执的方法</h3>
<h4 id="方法一邮件客户端自带回执" class="toc-header"><a class="toc-anchor" href="#方法一邮件客户端自带回执">¶</a> 方法一：邮件客户端自带回执</h4>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">Outlook：
选项 -&gt; 请求已读回执

Thunderbird：
选项 -&gt; 回执

Foxmail：
选项 -&gt; 要求回执
</code></pre>
<p><strong>收到回执后的信息：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">主题：已读：应聘前端开发工程师 - 张三
发件人：hr@target.com
内容：您的邮件已于 2024-01-15 14:23 被查看
</code></pre>
<p><strong>问题：</strong></p>
<ul>
<li>很多邮件客户端会提示用户"是否发送回执"</li>
<li>谨慎的用户会选择"否"</li>
<li>成功率约 30-40%</li>
</ul>
<hr>
<h4 id="方法二像素跟踪更隐蔽" class="toc-header"><a class="toc-anchor" href="#方法二像素跟踪更隐蔽">¶</a> 方法二：像素跟踪（更隐蔽）</h4>
<p>注意：在coremail环境（以及国内最常见的163、qq邮箱）中，这反而会容易导致被标记为垃圾邮件。</p>
<p><strong>原理：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">在邮件正文中插入一个 1x1 像素的透明图片
图片地址：http://你的服务器/track/user123.png

用户打开邮件时：
→ 邮件客户端加载图片
→ 向你的服务器发送请求
→ 你知道了邮件被打开

服务器日志：
192.168.1.100 - [15/Jan/2024:14:23:15] "GET /track/user123.png"
</code></pre>
<p><strong>实现：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-html">&lt;!-- 在邮件 HTML 中插入 --&gt;
&lt;img src="http://你的服务器/track/user123.png" width="1" height="1" style="display:none"&gt;
</code></pre>
<p><strong>优势：</strong></p>
<ul>
<li>用户完全无感知</li>
<li>不需要用户同意</li>
<li>成功率接近 100%（如果邮件客户端加载图片）</li>
</ul>
<p><strong>问题：</strong></p>
<ul>
<li>有些邮件客户端默认不加载外部图片</li>
<li>Gmail 会通过代理加载图片（无法获取真实 IP）</li>
</ul>
<hr>
<h4 id="方法三链接跟踪" class="toc-header"><a class="toc-anchor" href="#方法三链接跟踪">¶</a> 方法三：链接跟踪</h4>
<p><strong>原理：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-">在邮件中放一个下载链接
链接带有唯一标识符

示例：
"您好，这是我的简历：
 下载链接：http://你的服务器/resume/download?id=user123"

用户点击链接：
→ 服务器记录访问
→ 302 重定向到真实文件
→ 你知道了谁在什么时间点击了链接
</code></pre>
<p><strong>服务器端代码示例（Python Flask）：</strong></p>
<pre class="prismjs line-numbers" v-pre="true"><code class="language-python">@app.route('/resume/download')
def download():
    user_id = request.args.get('id')
    ip = request.remote_addr
    user_agent = request.headers.get('User-Agent')
  
    # 记录访问日志
    log_access(user_id, ip, user_agent)
  
    # 重定向到真实文件
    return redirect('https://cdn.example.com/real-resume.pdf')
</code></pre>
